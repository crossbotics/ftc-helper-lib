<rect x="20" y="188" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Robot's place (our frame) : x -12.0, y -48.0 in: ...</text>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">X = save the turn for BLUE, B = for RED (at the red wall)</text>
