<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="250" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="bold" fill="#101c45">When something breaks: fix it so it stays fixed</text>
  <rect x="20" y="64" width="130" height="92" rx="8" fill="#eef2f8" stroke="#101c45" stroke-width="1.5"/>
  <text x="85.0" y="105.0" text-anchor="middle" fill="#101c45" font-size="15" font-weight="bold">1. Write it down</text>
  <text x="85.0" y="125.0" text-anchor="middle" fill="#101c45" font-size="13">photo of the screen</text>
  <line x1="150" y1="110" x2="166" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="168" y="64" width="130" height="92" rx="8" fill="#eef2f8" stroke="#101c45" stroke-width="1.5"/>
  <text x="233.0" y="105.0" text-anchor="middle" fill="#101c45" font-size="15" font-weight="bold">2. Repeat it</text>
  <text x="233.0" y="125.0" text-anchor="middle" fill="#101c45" font-size="13">on the bench</text>
  <line x1="298" y1="110" x2="314" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="316" y="64" width="130" height="92" rx="8" fill="#eef2f8" stroke="#101c45" stroke-width="1.5"/>
  <text x="381.0" y="95.0" text-anchor="middle" fill="#101c45" font-size="15" font-weight="bold">3. Find where</text>
  <text x="381.0" y="115.0" text-anchor="middle" fill="#101c45" font-size="13">hardware, names,</text>
  <text x="381.0" y="135.0" text-anchor="middle" fill="#101c45" font-size="13">code, or library</text>
  <line x1="446" y1="110" x2="462" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="464" y="64" width="130" height="92" rx="8" fill="#e7f5ec" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="529.0" y="105.0" text-anchor="middle" fill="#101c45" font-size="15" font-weight="bold">4. Fix it</text>
  <text x="529.0" y="125.0" text-anchor="middle" fill="#101c45" font-size="13">in code? add a test</text>
  <line x1="594" y1="110" x2="610" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="612" y="64" width="130" height="92" rx="8" fill="#eef2f8" stroke="#101c45" stroke-width="1.5"/>
  <text x="677.0" y="105.0" text-anchor="middle" fill="#101c45" font-size="15" font-weight="bold">5. Note it</text>
  <text x="677.0" y="125.0" text-anchor="middle" fill="#101c45" font-size="13">in the team log</text>
  <line x1="529" y1="156" x2="529" y2="190" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="529" y="210" text-anchor="middle" font-size="13" fill="#1a7f37" font-weight="bold">The new test warns you</text>
  <text x="529" y="228" text-anchor="middle" font-size="13" fill="#1a7f37" font-weight="bold">if the problem comes back.</text>
</svg>
