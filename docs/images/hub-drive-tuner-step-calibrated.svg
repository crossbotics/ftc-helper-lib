<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 393" width="520" height="393" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="393" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">When it measures 48.00 in, press:</text>
<rect x="267" y="18" width="41" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="287.5" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A</text>
<rect x="6" y="70" width="508" height="317" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="263" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Drive tuner: choose a test ---</text>
<rect x="20" y="146" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Strafe: 48.00 in. OK (within 0.5 in of 48).</text>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: copy the lines below.</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- DONE ---</text>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Open Robot.java:</text>
<rect x="20" y="251" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  In drive(...): .wheelMm(96.8)</text>
<text x="26" y="287" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Open Tunables.java, find class Drive.</text>
<text x="26" y="308" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Change these lines (not there? add them):</text>
<rect x="20" y="314" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="329" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  public static double strafeCorrection = 1.180;</text>
<rect x="20" y="335" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="350" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  public static boolean calibrated = true;</text>
</svg>
