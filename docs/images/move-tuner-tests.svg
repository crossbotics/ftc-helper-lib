<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="760" height="590" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a9a"/></marker><marker id="ps" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2b3a9a"/></marker></defs>
<text x="20" y="36" font-size="20" font-weight="bold" fill="#101c45">The five tests, seen from above</text>
<text x="20" y="60" fill="#2d3446">Run them in this order. The robot's front points right. Each test ends about where it began.</text>
<text x="560" y="82" font-size="13" font-weight="bold" fill="#2d7a32">IT FINDS</text>
<text x="20" y="124" font-weight="bold" fill="#101c45">1 Creep</text>
<text x="20" y="144" font-size="13" fill="#2d3446">forward, then right (mecanum),</text>
<text x="20" y="160" font-size="13" fill="#2d3446">a little more power each step</text>
<text x="560" y="134" font-weight="bold" fill="#2d7a32">moveMinPower</text>
<g transform="translate(260,138.0) rotate(0)"><rect x="-20" y="-20" width="40" height="40" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="16,0 6,-7 6,7" fill="#101c45"/></g>
<line x1="284" y1="138" x2="320" y2="138" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)"/>
<line x1="260" y1="162" x2="260" y2="182" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)"/>
<text x="328" y="143" font-size="12" fill="#2b3a9a">a few inches</text>
<line x1="20" y1="186" x2="740" y2="186" stroke="#e5e7eb"/>
<text x="20" y="220" font-weight="bold" fill="#101c45">2 Stops</text>
<text x="20" y="240" font-size="13" fill="#2d3446">6, 12 and 24 in,</text>
<text x="20" y="256" font-size="13" fill="#2d3446">each one out and back</text>
<text x="560" y="230" font-weight="bold" fill="#2d7a32">slowDownIn</text>
<g transform="translate(240,234.0) rotate(0)"><rect x="-20" y="-20" width="40" height="40" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="16,0 6,-7 6,7" fill="#101c45"/></g>
<line x1="264" y1="216" x2="324" y2="216" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)" marker-start="url(#ps)"/>
<text x="330" y="220" font-size="12" fill="#2b3a9a">6 in</text>
<line x1="264" y1="234" x2="384" y2="234" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)" marker-start="url(#ps)"/>
<text x="390" y="238" font-size="12" fill="#2b3a9a">12 in</text>
<line x1="264" y1="252" x2="504" y2="252" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)" marker-start="url(#ps)"/>
<text x="510" y="256" font-size="12" fill="#2b3a9a">24 in</text>
<line x1="20" y1="282" x2="740" y2="282" stroke="#e5e7eb"/>
<text x="20" y="316" font-weight="bold" fill="#101c45">3 Turns</text>
<text x="20" y="336" font-size="13" fill="#2d3446">90, 135 and 45 degrees left,</text>
<text x="20" y="352" font-size="13" fill="#2d3446">and back each time</text>
<text x="560" y="317" font-weight="bold" fill="#2d7a32">turnMinPower, turnKp,</text>
<text x="560" y="335" font-weight="bold" fill="#2d7a32">turnKd, turnToleranceDeg</text>
<g transform="translate(300,330.0) rotate(0)"><rect x="-20" y="-20" width="40" height="40" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="16,0 6,-7 6,7" fill="#101c45"/></g>
<path d="M346,330 A46,46 0 0 0 300,284" fill="none" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)"/>
<path d="M306,272 A58,58 0 0 1 358,324" fill="none" stroke="#2b3a9a" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#p)"/>
<text x="372" y="316" font-size="12" fill="#2b3a9a">left (counterclockwise),</text>
<text x="372" y="332" font-size="12" fill="#2b3a9a">then back (dashed)</text>
<line x1="20" y1="378" x2="740" y2="378" stroke="#e5e7eb"/>
<text x="20" y="412" font-weight="bold" fill="#101c45">4 Drift</text>
<text x="20" y="432" font-size="13" fill="#2d3446">48 in forward and back</text>
<text x="20" y="448" font-size="13" fill="#2d3446">(mecanum: also right and left)</text>
<text x="560" y="422" font-weight="bold" fill="#2d7a32">nothing: a report</text>
<g transform="translate(240,426.0) rotate(0)"><rect x="-20" y="-20" width="40" height="40" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="16,0 6,-7 6,7" fill="#101c45"/></g>
<line x1="264" y1="426" x2="520" y2="426" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)" marker-start="url(#ps)"/>
<text x="392" y="418" text-anchor="middle" font-size="12" fill="#2b3a9a">48 in</text>
<line x1="20" y1="474" x2="740" y2="474" stroke="#e5e7eb"/>
<text x="20" y="508" font-weight="bold" fill="#101c45">5 Move and turn</text>
<text x="20" y="528" font-size="13" fill="#2d3446">24 in sideways while it</text>
<text x="20" y="544" font-size="13" fill="#2d3446">turns 90 degrees (mecanum)</text>
<text x="560" y="509" font-weight="bold" fill="#2d7a32">moveTurnScale,</text>
<text x="560" y="527" font-weight="bold" fill="#2d7a32">moveMaxTurnPower</text>
<g transform="translate(240,498.0) rotate(0)"><rect x="-16" y="-16" width="32" height="32" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="12,0 2,-7 2,7" fill="#101c45"/></g>
<g transform="translate(240,548.0) rotate(-90)"><rect x="-16" y="-16" width="32" height="32" rx="5" fill="#eef2f8" stroke="#101c45" stroke-width="2"/><polygon points="12,0 2,-7 2,7" fill="#101c45"/></g>
<path d="M262,498 Q300,522 262,548" fill="none" stroke="#2b3a9a" stroke-width="2.5" marker-end="url(#p)"/>
<text x="300" y="516" font-size="12" fill="#2b3a9a">24 in sideways,</text>
<text x="300" y="532" font-size="12" fill="#2b3a9a">and 90 degrees left</text>
<text x="300" y="548" font-size="12" fill="#2b3a9a">on the way (moveWithTurn)</text>
</svg>
