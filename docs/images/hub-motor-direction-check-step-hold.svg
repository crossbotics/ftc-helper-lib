<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" width="520" height="372" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="372" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">Hold on gamepad 1:</text>
<rect x="159" y="18" width="118" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="218.0" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">X (hold)</text>
<rect x="6" y="70" width="508" height="296" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="242" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! Hands off the wheels. Let go = stop.</text>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Motor direction check ---</text>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: hold a button. The TOP of that wheel</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">must move toward the FRONT of the robot.</text>
<rect x="20" y="209" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">X front-left : "front_left"  RUNNING</text>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Y front-right : "front_right" (reversed in code)</text>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
<text x="26" y="287" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"front_left" rolled FORWARD? It is right.</text>
<rect x="20" y="293" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="308" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">It rolled BACKWARD? In Robot.java, drive line:</text>
<rect x="20" y="314" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="329" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  .reversed("front_left", "front_right")</text>
</svg>
