<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="440" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker>
  </defs>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#101c45">A Pinpoint: which number is which (robot seen from above)</text>

  <!-- robot: 400 mm wide x 430 mm long, 0.6 px per mm; front up -->
  <text x="200" y="74" text-anchor="middle" fill="#4b5563" font-weight="bold">FRONT</text>
  <text x="200" y="402" text-anchor="middle" fill="#4b5563" font-weight="bold">BACK</text>
  <text x="62" y="225" text-anchor="end" fill="#4b5563" font-weight="bold">LEFT</text>
  <text x="338" y="200" fill="#4b5563" font-weight="bold" font-size="13">RIGHT</text>
  <text x="200" y="420" text-anchor="middle" fill="#4b5563" font-size="13">LEFT and RIGHT as the robot faces FRONT</text>
  <rect x="80" y="110" width="240" height="258" rx="6" fill="#eef2f8" stroke="#101c45" stroke-width="2"/>

  <!-- width (gray, top) -->
  <line x1="80" y1="96" x2="320" y2="96" stroke="#4b5563" stroke-width="1.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="200" y="90" text-anchor="middle" font-size="13" fill="#4b5563">width 400 (2nd size number)</text>
  <!-- length (gray, far right) -->
  <line x1="385" y1="110" x2="385" y2="368" stroke="#4b5563" stroke-width="1.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="400" y="239" font-size="13" fill="#4b5563" text-anchor="middle" transform="rotate(90 400 239)">length 430 (1st size number)</text>

  <!-- X pod: rolls forward, 284 from LEFT -->
  <rect x="241" y="160" width="18" height="44" rx="4" fill="#1f4e9c"/>
  <line x1="250" y1="150" x2="250" y2="122" stroke="#1f4e9c" stroke-width="2" marker-end="url(#b)"/>
  <text x="266" y="188" fill="#1f4e9c" font-weight="bold">X pod</text>
  <line x1="80" y1="222" x2="250" y2="222" stroke="#b03030" stroke-width="2" marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="185" y="240" text-anchor="middle" font-size="13" fill="#b03030">284 from LEFT edge</text>

  <!-- Y pod: rolls sideways, 383 from FRONT -->
  <rect x="118" y="311" width="44" height="18" rx="4" fill="#1f4e9c"/>
  <line x1="172" y1="320" x2="200" y2="320" stroke="#1f4e9c" stroke-width="2" marker-end="url(#b)"/>
  <text x="140" y="350" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Y pod</text>
  <line x1="105" y1="110" x2="105" y2="320" stroke="#b03030" stroke-width="2" marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="112" y="275" font-size="13" fill="#b03030">383 from</text>
  <text x="112" y="291" font-size="13" fill="#b03030">FRONT edge</text>

  <!-- the line, explained -->
  <text x="440" y="80" font-weight="bold" fill="#101c45">The line in Robot.java</text>
  <text x="440" y="106" font-family="Menlo, Consolas, monospace" font-size="13" fill="#101c45">.robotSizeMm(430, 400)</text>
  <text x="440" y="126" font-size="13" fill="#4b5563">430 = length, front to back</text>
  <text x="440" y="144" font-size="13" fill="#4b5563">400 = width, left to right</text>
  <text x="440" y="180" font-family="Menlo, Consolas, monospace" font-size="13" fill="#101c45">.podsFromEdgesMm(284, 383)</text>
  <text x="440" y="200" font-size="13" fill="#b03030">284 = X pod (rolls forward),</text>
  <text x="440" y="218" font-size="13" fill="#b03030">      from the LEFT edge</text>
  <text x="440" y="236" font-size="13" fill="#b03030">383 = Y pod (rolls sideways),</text>
  <text x="440" y="254" font-size="13" fill="#b03030">      from the FRONT edge</text>
  <text x="440" y="296" font-size="13" fill="#101c45">Measure to the middle of each</text>
  <text x="440" y="314" font-size="13" fill="#101c45">pod's wheel. Bumpers off.</text>
  <text x="440" y="350" font-size="13" fill="#101c45">X pod cable: Pinpoint port X.</text>
  <text x="440" y="368" font-size="13" fill="#101c45">Y pod cable: Pinpoint port Y.</text>
</svg>
