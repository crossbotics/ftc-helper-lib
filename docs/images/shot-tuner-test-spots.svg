<text x="46.0" y="578.0" font-size="14" fill="#222" text-anchor="start">Spots 1 to 4: toward your corner, the nearest first. The farthest</text>
<text x="46.0" y="596.0" font-size="14" fill="#222" text-anchor="start">spot is about 66 in from the goal, close to the corner.</text>
<circle cx="28" cy="619" r="8" fill="#fff" stroke="#1f4e9c" stroke-width="3"/>
<text x="46.0" y="624.0" font-size="14" fill="#222" text-anchor="start">Side check: the same distance (42 in) straight toward your</text>
<text x="46.0" y="642.0" font-size="14" fill="#222" text-anchor="start">wall and toward the audience. Each in its own run (STOP, INIT).</text>
<rect x="20" y="656" width="18" height="12" fill="#3b4148"/>
<text x="46.0" y="667.0" font-size="14" fill="#222" text-anchor="start">The HIVE frame and the FLOWERs: robots cannot go there. Robots</text>
<text x="46.0" y="685.0" font-size="14" fill="#222" text-anchor="start">fit under the HIVEs, but a shot from there is too steep.</text>
