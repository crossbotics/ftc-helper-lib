<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="500" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
  </defs>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#101c45">A move's power, from its start to its end</text>
  <text x="20" y="60" fill="#2d3446">A 24 in move at power 0.6. Example numbers.</text>
  <!-- axes -->
  <line x1="90" y1="330" x2="720" y2="330" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="96" stroke="#4b5563" stroke-width="1.5"/>
  <text x="80" y="115" text-anchor="end" fill="#2d3446">0.6</text>
  <text x="80" y="298" text-anchor="end" fill="#2d3446">0.10</text>
  <text x="80" y="335" text-anchor="end" fill="#2d3446">0</text>
  <text x="34" y="210" fill="#2d3446" transform="rotate(-90 34 210)" text-anchor="middle">power</text>
  <text x="90" y="352" text-anchor="middle" fill="#2d3446">0</text>
  <text x="230" y="352" text-anchor="middle" fill="#2d3446">6</text>
  <text x="370" y="352" text-anchor="middle" fill="#2d3446">12</text>
  <text x="510" y="352" text-anchor="middle" fill="#2d3446">18</text>
  <text x="650" y="352" text-anchor="middle" fill="#2d3446">24 in</text>
  <!-- end of the move -->
  <line x1="650" y1="96" x2="650" y2="330" stroke="#101c45" stroke-dasharray="5 5"/>
  <text x="650" y="90" text-anchor="middle" fill="#101c45" font-weight="bold">the end of the move</text>
  <!-- moveMinPower -->
  <line x1="90" y1="293" x2="650" y2="293" stroke="#6b7280" stroke-dasharray="2 4"/>
  <text x="100" y="285" fill="#4b5563">moveMinPower: every move ends at this power</text>
  <!-- full power part -->
  <path d="M90,330 V110 H510" fill="none" stroke="#2b3a9a" stroke-width="3"/>
  <text x="300" y="102" text-anchor="middle" fill="#2b3a9a" font-weight="bold">full power (0.6)</text>
  <!-- slowDownIn 0: late, steep -->
  <path d="M510,110 H594 L650,293" fill="none" stroke="#b42318" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="652" y1="316" x2="688" y2="316" stroke="#b42318" stroke-width="3" marker-end="url(#r)"/>
  <text x="694" y="321" fill="#b42318" font-weight="bold">slides</text>
  <!-- slowDownIn 6: early, gentle -->
  <path d="M510,110 L650,293" fill="none" stroke="#2d7a32" stroke-width="3"/>
  <circle cx="650" cy="293" r="5" fill="#2d7a32"/>
  <!-- brackets -->
  <path d="M510,372 V380 H650 V372" fill="none" stroke="#2d7a32" stroke-width="2"/>
  <text x="500" y="385" text-anchor="end" fill="#2d7a32" font-weight="bold">slowDownIn = 6: slow down over the last 6 in</text>
  <path d="M594,398 V406 H650 V398" fill="none" stroke="#b42318" stroke-width="2"/>
  <text x="584" y="411" text-anchor="end" fill="#b42318" font-weight="bold">slowDownIn = 0: only the last 10% (2.4 in)</text>
  <!-- what it means -->
  <text x="20" y="448" fill="#b42318" font-weight="bold">Red:</text>
  <text x="70" y="448" fill="#2d3446">the robot is still fast near the end. It slides past the end.</text>
  <text x="20" y="474" fill="#2d7a32" font-weight="bold">Green:</text>
  <text x="80" y="474" fill="#2d3446">it has time to slow down, and it stops on the end. A bigger slowDownIn makes moves slower.</text>
</svg>
