<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 309" width="520" height="309" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="309" fill="#ffffff"/>
<text x="16" y="278" font-size="14" fill="#555">Press on gamepad 1:</text>
<rect x="166" y="253" width="173" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="252.5" y="281" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">D-pad, then A</text>
<rect x="6" y="6" width="508" height="233" rx="14" fill="#2b2f36"/>
<text x="22" y="36" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="50" width="488" height="179" rx="6" fill="#ffffff"/>
<text x="26" y="76" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Tune and check ---</text>
<text x="26" y="97" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Robot: Robot</text>
<text x="26" y="118" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  Hardware Check: every device found, ...</text>
<text x="26" y="139" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">  ...</text>
<rect x="20" y="145" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="160" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">&gt; Motor Finder: a lift's or arm's limits and positions</text>
<text x="26" y="181" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">  ...</text>
<text x="26" y="202" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">D-pad up/down = pick, A = open it. Then ▶.</text>
</svg>
