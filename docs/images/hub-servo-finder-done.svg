<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 447" width="764" height="447" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="764" height="447" rx="18" fill="#2b2f36"/>
<rect x="14" y="14" width="736" height="44" rx="6" fill="#3d434d"/>
<text x="30" y="42" fill="#ffffff" font-weight="bold">Tune and check: Servo Finder</text>
<text x="734" y="42" fill="#9fd89f" text-anchor="end">▶ running</text>
<rect x="14" y="70" width="736" height="363" rx="6" fill="#ffffff"/>
<text x="30" y="100" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" font-weight="bold" xml:space="preserve">--- Servo "claw"  (BACK = another) ---</text>
<text x="30" y="121" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">Hint : bigger = clockwise (seller); test: D-pad up</text>
<text x="30" y="142" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">Position : 0.770</text>
<text x="30" y="163" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">Step : 0.010  (D-pad left = smaller, right = bigger)</text>
<text x="30" y="184" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">End X : 0.120</text>
<text x="30" y="205" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">End B : 0.880</text>
<text x="30" y="226" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">D-pad up/down = move (LB = past the ends), X/B = ends, A = save position, Y = undo</text>
<text x="30" y="247" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">GUIDE (or hold START) = help</text>
<text x="30" y="268" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" font-weight="bold" xml:space="preserve">--- Copy into your code ---</text>
<text x="30" y="289" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">PositionServo.create(hardwareMap, "claw").limits(0.120, 0.880)</text>
<text x="30" y="310" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">    .position("P1", 0.210)</text>
<text x="30" y="331" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">    .position("P2", 0.770)</text>
<rect x="22" y="337" width="720" height="21" rx="3" fill="#fff3a8"/>
<text x="30" y="352" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">Tunables.Claw: P1 = 0.210, P2 = 0.770</text>
<rect x="22" y="358" width="720" height="21" rx="3" fill="#fff3a8"/>
<text x="30" y="373" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">    // rename P1, P2... (open, closed); keep them between 0.120 and 0.880</text>
<text x="30" y="394" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a" xml:space="preserve">(saved to the hub when you press STOP)</text>
</svg>
