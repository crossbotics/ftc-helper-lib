<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="540" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a9a"/></marker>
  </defs>
  <text x="20" y="36" font-size="20" font-weight="bold" fill="#101c45">Drive Tuner: the floor, seen from above</text>
  <!-- clear floor: 5 ft ahead and 5 ft to the right -->
  <path d="M40,64 H730 V250 H330 V370 H40 Z" fill="#f3f7ee" stroke="#2d7a32" stroke-dasharray="8 6"/>
  <text x="712" y="220" text-anchor="end" fill="#2d7a32" font-weight="bold">clear floor: 5 ft ahead and 5 ft to the right</text>
  <text x="712" y="238" text-anchor="end" font-size="13" fill="#2d3446">a test drive can roll past the tape (not to scale)</text>
  <!-- tape along the left wheels -->
  <rect x="60" y="120" width="610" height="10" fill="#f5cf55" stroke="#b08900"/>
  <line x1="136" y1="104" x2="136" y2="134" stroke="#8a6d00" stroke-width="3"/>
  <line x1="664" y1="104" x2="664" y2="134" stroke="#8a6d00" stroke-width="3"/>
  <text x="136" y="98" text-anchor="middle" fill="#8a6d00" font-weight="bold">0</text>
  <text x="664" y="98" text-anchor="middle" fill="#8a6d00" font-weight="bold">48 in</text>
  <text x="400" y="98" text-anchor="middle" fill="#8a6d00" font-weight="bold">tape: the left wheels' outside edge runs along it</text>
  <!-- robot at start: front to the right, left side up -->
  <rect x="66" y="140" width="72" height="80" rx="6" fill="#eef2f8" stroke="#101c45" stroke-width="2"/>
  <rect x="70" y="130" width="26" height="12" rx="3" fill="#374151"/>
  <rect x="110" y="130" width="26" height="12" rx="3" fill="#374151"/>
  <rect x="70" y="218" width="26" height="12" rx="3" fill="#374151"/>
  <rect x="110" y="218" width="26" height="12" rx="3" fill="#374151"/>
  <polygon points="134,180 120,171 120,189" fill="#101c45"/>
  <text x="102" y="164" text-anchor="middle" font-size="11" fill="#4b5563">front →</text>
  <!-- forward arrow -->
  <line x1="152" y1="170" x2="650" y2="170" stroke="#2b3a9a" stroke-width="3" marker-end="url(#p)"/>
  <text x="400" y="160" text-anchor="middle" fill="#2b3a9a" font-weight="bold">push, then drive: the front left wheel's front edge from 0 to 48 in</text>
  <!-- strafe arrow -->
  <line x1="102" y1="236" x2="102" y2="356" stroke="#2b3a9a" stroke-width="3" marker-end="url(#p)"/>
  <text x="118" y="290" fill="#2b3a9a" font-weight="bold">strafe test (mecanum): it slides right.</text>
  <text x="118" y="310" font-size="13" fill="#2b3a9a">Measure from the tape</text>
  <text x="118" y="326" font-size="13" fill="#2b3a9a">to the left wheels.</text>
  <!-- steps -->
  <text x="20" y="400" fill="#101c45" font-weight="bold">Start:</text>
  <text x="150" y="400" fill="#2d3446">left wheels touch the tape, front left wheel's front edge on 0.</text>
  <text x="20" y="424" fill="#101c45" font-weight="bold">1. Push test:</text>
  <text x="150" y="424" fill="#2d3446">A, roll it by hand, wheels on the tape, until that edge is on 48 in. B.</text>
  <text x="20" y="448" fill="#101c45" font-weight="bold">2. Drive test:</text>
  <text x="150" y="448" fill="#2d3446">back to the start. A, it drives. Measure 0 to the edge, set it, A.</text>
  <text x="20" y="472" fill="#101c45" font-weight="bold">3. Strafe test:</text>
  <text x="150" y="472" fill="#2d3446">back to the start. A, it strafes. Measure tape to wheels, set it, A.</text>
  <text x="150" y="492" fill="#2d3446">Tests 2 and 3: again until they measure 48. 4. Turn 90 left: a check.</text>
  <text x="20" y="516" fill="#101c45" font-weight="bold">5. Copy:</text>
  <text x="150" y="516" fill="#2d3446">.wheelMm(...), strafeCorrection, then calibrated = true.</text>
</svg>
