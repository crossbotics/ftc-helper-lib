<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 513" width="520" height="513" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="513" fill="#ffffff"/>
<text x="130" y="20" text-anchor="middle" font-size="13" fill="#555">the servo, seen from above</text>
<rect x="104" y="81" width="52" height="38" rx="6" fill="#d8dde6" stroke="#333" stroke-width="2"/>
<g transform="rotate(-94.5 130 100)"><line x1="130" y1="100" x2="130" y2="38" stroke="#a9bde0" stroke-width="9" stroke-linecap="round" stroke-dasharray="4 6"/></g>
<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<path d="M58.2,105.6 A72,72 0 0 1 146.8,30.0" fill="none" stroke="#1f4e9c" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="rotate(13.5 130 100)"><line x1="130" y1="100" x2="130" y2="38" stroke="#1f4e9c" stroke-width="9" stroke-linecap="round"/></g><circle cx="130" cy="100" r="10" fill="#1f4e9c"/>
<text x="130" y="182" text-anchor="middle" font-size="14" fill="#2d7a32">release: the piece rolls through</text>
<text x="300" y="70" font-size="14" fill="#555">Where it lets go, press:</text>
<rect x="300" y="82" width="41" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="320.5" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">B</text>
<rect x="6" y="190" width="508" height="317" rx="14" fill="#2b2f36"/>
<text x="22" y="220" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="234" width="488" height="263" rx="6" fill="#ffffff"/>
<text x="26" y="260" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Feed stop finder: step 3 of 3, test shots ---</text>
<text x="26" y="281" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: load a piece. LB = flywheel on.</text>
<text x="26" y="302" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">HOLD (X) : 0.150</text>
<rect x="20" y="308" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="323" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">LET GO (B) : 0.550</text>
<text x="26" y="344" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Opens in : about 0.25 s (from the servo's speed)</text>
<text x="26" y="365" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- NOT DONE ---</text>
<text x="26" y="386" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">0 of 5 test shots done.</text>
<text x="26" y="407" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
<rect x="20" y="413" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="428" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  public static double feedStopHold = 0.150;</text>
<rect x="20" y="434" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="449" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  public static double feedStopRelease = 0.550;</text>
<text x="26" y="470" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
</svg>
