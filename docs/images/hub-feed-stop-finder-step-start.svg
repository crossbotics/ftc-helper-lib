<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" width="520" height="408" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="408" fill="#ffffff"/>
<text x="130" y="20" text-anchor="middle" font-size="13" fill="#555">the servo, seen from above</text>
<rect x="104" y="81" width="52" height="38" rx="6" fill="#d8dde6" stroke="#333" stroke-width="2"/>
<g transform="rotate(0.0 130 100)"><line x1="130" y1="100" x2="130" y2="38" stroke="#1f4e9c" stroke-width="9" stroke-linecap="round"/></g><circle cx="130" cy="100" r="10" fill="#1f4e9c"/>
<text x="130" y="182" text-anchor="middle" font-size="14" fill="#2d7a32">the feed stop at the start point</text>
<text x="300" y="70" font-size="14" fill="#555">Press on gamepad 1:</text>
<rect x="300" y="82" width="41" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="320.5" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A</text>
<rect x="6" y="190" width="508" height="212" rx="14" fill="#2b2f36"/>
<text x="22" y="220" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="234" width="488" height="158" rx="6" fill="#ffffff"/>
<text x="26" y="260" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! A = the feed stop JUMPS to this number.</text>
<text x="26" y="281" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Feed stop finder: first move ---</text>
<text x="26" y="302" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: set a number near where it sits now.</text>
<rect x="20" y="308" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="323" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Start point : 0.500</text>
<text x="26" y="344" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Step : 0.050  (D-pad left/right)</text>
<text x="26" y="365" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Not sure? Take the servo's arm off. Use 0.500.</text>
</svg>
