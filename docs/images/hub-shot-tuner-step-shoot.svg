<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 309" width="520" height="309" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="309" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">Press on gamepad 1:</text>
<rect x="166" y="18" width="52" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="192.0" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">RB</text>
<rect x="6" y="70" width="508" height="233" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="179" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Shot tuner ---</text>
<rect x="20" y="146" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: mark the oldest shot.</text>
<rect x="20" y="167" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">A = it went IN. B = it MISSED.</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">&gt; Speed : 2600 RPM, now 2591</text>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Shots to mark : 1</text>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Went in at 2600 RPM : 0 of 0 (shoot 3 to 5)</text>
</svg>
