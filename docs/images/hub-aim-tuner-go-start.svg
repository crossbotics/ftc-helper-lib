<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 351" width="520" height="351" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="351" fill="#ffffff"/>
<text x="16" y="320" font-size="14" fill="#555">Press on the Driver Hub:</text>
<rect x="202" y="295" width="129" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="266.5" y="323" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">▶ (start)</text>
<rect x="6" y="6" width="508" height="275" rx="14" fill="#2b2f36"/>
<text x="22" y="36" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="50" width="488" height="221" rx="6" fill="#ffffff"/>
<text x="26" y="76" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! Hold A: the ROBOT turns by itself.</text>
<text x="26" y="97" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! RB SHOOTS. Safety glasses. Nobody in front.</text>
<text x="26" y="118" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! The sticks drive. Let go = stop.</text>
<text x="26" y="139" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Aim tuner: makes shots go in the MIDDLE</text>
<text x="26" y="160" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">of the goal, not left or right of it.</text>
<text x="26" y="181" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Starts from : 0.0 deg (Tunables.java)</text>
<text x="26" y="202" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Camera : STREAMING</text>
<rect x="20" y="208" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="223" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Press ▶ on the Driver Hub to start.</text>
<text x="26" y="244" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
</svg>
