<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 351" width="520" height="351" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="351" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">Hold on gamepad 1:</text>
<rect x="159" y="18" width="118" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="218.0" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A (hold)</text>
<rect x="6" y="70" width="508" height="275" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="221" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! Parts move while you hold A. Let go = stop.</text>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Encoder check: 3 of 5 ---</text>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: hold A until every motor is checked.</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Watch: a lift or an arm must move UP.</text>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"front_left" (drive) : OK: counts up (+412)</text>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"front_right" (drive) : OK: counts up (+405)</text>
<rect x="20" y="251" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"back_left" (drive) : PUSHING</text>
<text x="26" y="287" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"back_right" (drive) : not yet</text>
<text x="26" y="308" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">"lift" (Lift) : not yet</text>
</svg>
