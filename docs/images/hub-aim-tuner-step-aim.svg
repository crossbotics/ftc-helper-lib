<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="330" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">Press on gamepad 1:</text>
<rect x="166" y="18" width="96" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="214.0" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">hold A</text>
<rect x="6" y="70" width="508" height="254" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="200" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! Hold A = the robot turns. Let go = stop.</text>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Aim tuner ---</text>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: hold A, then RB = shoot one.</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Aim offset : 0.0 deg</text>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Goal is 0.1 deg LEFT of the camera's middle.</text>
<rect x="20" y="230" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Still to turn : 0.1 deg LEFT</text>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Distance : 58.5 in</text>
<text x="26" y="287" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Launcher : ready</text>
</svg>
