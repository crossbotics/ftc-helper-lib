<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d7a32"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="18" font-weight="bold" fill="#222">Every angle in an autonomous counts the same way</text>
  <text x="20" y="58" fill="#444">Counterclockwise, like the IMU: 90 = left. For a move, a turn and a heading.</text>

  <!-- ===================== left: the circle ===================== -->
  <circle cx="200" cy="235" r="110" fill="none" stroke="#9cc49f" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="165" y="190" width="70" height="90" rx="8" fill="#eef2f8" stroke="#333" stroke-width="2"/>
  <polygon points="200,196 189,214 211,214" fill="#333"/>
  <text x="200" y="251" text-anchor="middle" font-size="12" fill="#555">front</text>

  <circle cx="200" cy="125" r="5" fill="#2d7a32"/>
  <text x="200" y="110" text-anchor="middle" fill="#2d7a32" font-weight="bold">0 forward</text>
  <circle cx="90" cy="235" r="5" fill="#2d7a32"/>
  <text x="80" y="231" text-anchor="end" fill="#2d7a32" font-weight="bold">90</text>
  <text x="80" y="249" text-anchor="end" fill="#2d7a32">left</text>
  <circle cx="200" cy="345" r="5" fill="#2d7a32"/>
  <text x="200" y="370" text-anchor="middle" fill="#2d7a32" font-weight="bold">180 back</text>
  <circle cx="310" cy="235" r="5" fill="#2d7a32"/>
  <text x="320" y="231" fill="#2d7a32" font-weight="bold">-90</text>
  <text x="320" y="249" fill="#2d7a32">right</text>

  <path d="M 165 131 A 110 110 0 0 0 103 186" fill="none" stroke="#2d7a32" stroke-width="4" marker-end="url(#g)"/>
  <text x="128" y="140" text-anchor="end" fill="#2d7a32" font-size="13">counts up</text>

  <!-- divider -->
  <line x1="400" y1="85" x2="400" y2="400" stroke="#ccc" stroke-width="2"/>

  <!-- ===================== right: the same 90, and the words ===================== -->
  <text x="420" y="110" font-weight="bold" fill="#222">The same 90:</text>
  <text x="420" y="138" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.move("Slide", 12, 90, 0.4)</text>
  <text x="440" y="158" fill="#444">slides <tspan font-weight="bold">left</tspan>, still facing forward</text>
  <text x="420" y="188" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.turn("Face left", 90, 0.4)</text>
  <text x="440" y="208" fill="#444">turns <tspan font-weight="bold">left</tspan>, in place</text>

  <text x="420" y="256" font-weight="bold" fill="#222">Or say it in words, with no angle:</text>
  <text x="420" y="284" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.forward(...)</text>
  <text x="570" y="284" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.back(...)</text>
  <text x="420" y="308" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.left(...)</text>
  <text x="570" y="308" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.right(...)</text>
  <text x="420" y="332" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.turnLeft(...)</text>
  <text x="570" y="332" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.turnRight(...)</text>
  <text x="420" y="366" fill="#444">The numbers in the words are always plus:</text>
  <text x="420" y="386" font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">.right("Park", 20, 0.7)</text>
</svg>
