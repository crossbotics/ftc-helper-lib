<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 309" width="520" height="309" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="309" fill="#ffffff"/>
<text x="16" y="278" font-size="14" fill="#555">When it stops, press:</text>
<rect x="181" y="253" width="173" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="267.5" y="281" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">D-pad, then A</text>
<rect x="6" y="6" width="508" height="233" rx="14" fill="#2b2f36"/>
<text x="22" y="36" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="50" width="488" height="179" rx="6" fill="#ffffff"/>
<text x="26" y="76" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">!! It stopped. No move starts until you measure.</text>
<text x="26" y="97" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Drive: done. Now measure it ---</text>
<text x="26" y="118" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: measure from the start mark to the same</text>
<text x="26" y="139" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">edge of the same wheel now. Set that number.</text>
<rect x="20" y="145" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="160" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Your number : 47.50 in</text>
<text x="26" y="181" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">D-pad up/down = 1 in, right/left = 0.25 in.</text>
<text x="26" y="202" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">A = use your number.</text>
</svg>
