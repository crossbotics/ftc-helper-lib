<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 309" width="520" height="309" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="309" fill="#ffffff"/>
<text x="16" y="43" font-size="14" fill="#555">With the arrow on 5 Move and turn, press:</text>
<rect x="325" y="18" width="41" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="345.5" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A</text>
<rect x="6" y="70" width="508" height="233" rx="14" fill="#2b2f36"/>
<text x="22" y="100" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="114" width="488" height="179" rx="6" fill="#ffffff"/>
<text x="26" y="140" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Move tuner: choose a test ---</text>
<rect x="20" y="146" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="161" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">RUN AGAIN:</text>
<text x="26" y="182" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  the turn ends late: turn more.</text>
<text x="26" y="203" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">moveTurnScale is now 0.94.</text>
<rect x="20" y="209" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="224" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Next: run 5 Move and turn again.</text>
<text x="26" y="245" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">Worst: off 24.9 deg too much, past 0.0 deg OK</text>
<text x="26" y="266" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
</svg>
