<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="760" height="420" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a9a"/></marker>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="bold" fill="#101c45">Odometry Tuner: where the pods sit (a Pinpoint), seen from above</text>
  <!-- robot, front up -->
  <text x="190" y="66" text-anchor="middle" fill="#4b5563" font-weight="bold">FRONT</text>
  <rect x="70" y="76" width="240" height="280" rx="8" fill="#eef2f8" stroke="#101c45" stroke-width="2"/>
  <circle cx="190" cy="196" r="6" fill="#101c45"/>
  <text x="178" y="190" text-anchor="end" fill="#101c45" font-weight="bold">C</text>
  <!-- X pod: right of C, rolls forward -->
  <rect x="268" y="176" width="18" height="40" rx="4" fill="#1f4e9c"/>
  <text x="296" y="202" fill="#1f4e9c" font-weight="bold">X</text>
  <line x1="196" y1="232" x2="272" y2="232" stroke="#b03030" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="234" y="250" text-anchor="middle" font-size="13" fill="#b03030">84 mm right</text>
  <!-- Y pod: behind C, rolls sideways -->
  <rect x="170" y="318" width="40" height="18" rx="4" fill="#1f4e9c"/>
  <text x="220" y="333" fill="#1f4e9c" font-weight="bold">Y</text>
  <line x1="150" y1="202" x2="150" y2="320" stroke="#b03030" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="142" y="268" text-anchor="end" font-size="13" fill="#b03030">168 mm</text>
  <text x="142" y="284" text-anchor="end" font-size="13" fill="#b03030">behind</text>
  <!-- the meaning -->
  <text x="350" y="96" fill="#101c45" font-weight="bold">.offsetsMm(-84, -168)</text>
  <text x="350" y="122" fill="#2d3446">1st number: the X pod (rolls forward), how far LEFT</text>
  <text x="350" y="142" fill="#2d3446">of C. Right of C = negative: -84.</text>
  <text x="350" y="172" fill="#2d3446">2nd number: the Y pod (rolls sideways), how far</text>
  <text x="350" y="192" fill="#2d3446">FORWARD of C. Behind C = negative: -168.</text>
  <text x="350" y="222" font-size="13" fill="#4b5563">C = the robot's centre (the middle of the wheels).</text>
  <text x="350" y="240" font-size="13" fill="#4b5563">The tuner measures both: no ruler needed.</text>
  <!-- the tests -->
  <text x="350" y="276" fill="#101c45" font-weight="bold">The tests (D-pad picks, A starts, B ends):</text>
  <text x="350" y="300" fill="#2d3446">1. Forward 48 in along tape: the X pod's direction.</text>
  <text x="350" y="322" fill="#2d3446">2. Left 24 in: the Y pod's direction.</text>
  <text x="350" y="344" fill="#2d3446">3. Spin 3+ turns: the two offsets.</text>
  <text x="350" y="366" fill="#2d3446">4. Copy the numbers, rebuild.</text>
  <text x="350" y="388" fill="#2d3446">5. Loop and back to the mark: checked = true.</text>
  <line x1="40" y1="356" x2="40" y2="96" stroke="#2b3a9a" stroke-width="3" marker-end="url(#b)"/>
  <text x="34" y="390" font-size="13" fill="#2b3a9a">forward</text>
</svg>
