<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="520" height="330" fill="#ffffff"/>
<text x="16" y="299" font-size="14" fill="#555">Press on gamepad 1:</text>
<rect x="166" y="274" width="41" height="42" rx="21" fill="#ffd54d" stroke="#333" stroke-width="2"/>
<text x="186.5" y="302" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A</text>
<rect x="6" y="6" width="508" height="254" rx="14" fill="#2b2f36"/>
<text x="22" y="36" fill="#ffffff" font-size="14" font-weight="bold">Driver Hub</text>
<rect x="16" y="50" width="488" height="200" rx="6" fill="#ffffff"/>
<text x="26" y="76" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" xml:space="preserve">--- Drive tuner ---</text>
<rect x="20" y="82" width="480" height="21" rx="3" fill="#fff3a8"/>
<text x="26" y="97" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">&gt; Push (by hand)</text>
<text x="26" y="118" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  Drive forward</text>
<text x="26" y="139" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  Strafe right</text>
<text x="26" y="160" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  Strafe left</text>
<text x="26" y="181" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  Turn 90 left</text>
<text x="26" y="202" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">D-pad up/down = choose, A = start</text>
<text x="26" y="223" font-family="Menlo, Consolas, monospace" font-size="13" fill="#999" xml:space="preserve">...</text>
</svg>
