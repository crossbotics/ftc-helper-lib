<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">The robot project's folders</text>

  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#222">
    <text x="30" y="80" font-weight="bold">OUR-ROBOT/</text>
    <text x="30" y="118">├─ FtcRobotController/</text>
    <text x="30" y="156">├─ TeamCode/</text>
    <text x="30" y="194">│</text><text x="64" y="194">├─ build.gradle</text>
    <text x="30" y="232">│</text><text x="64" y="232">└─ src/main/java/org/firstinspires/ftc/</text>
    <text x="30" y="258">│</text><text x="98" y="258" font-weight="bold" fill="#2d7a32">teamcode/</text>
    <text x="30" y="296">├─ ftc-helper-lib/</text>
    <text x="30" y="334">└─ settings.gradle</text>
  </g>

  <g font-size="13">
    <text x="440" y="80" fill="#1f4e9c" font-weight="bold">Open this folder in Android Studio</text>
    <text x="440" y="118" fill="#555">FTC's code: do not change it</text>
    <text x="440" y="194" fill="#555">Set up 4, step 3</text>
    <text x="440" y="258" fill="#2d7a32" font-weight="bold">Your team's code goes here</text>
    <text x="440" y="296" fill="#555">The library (Set up 4, step 1)</text>
    <text x="440" y="334" fill="#555">Set up 4, step 2</text>
  </g>
  <rect x="90" y="241" width="340" height="24" rx="4" fill="none" stroke="#2d7a32" stroke-width="2"/>
</svg>
