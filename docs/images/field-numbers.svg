<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="780" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d7a32"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">Field numbers: inches, seen from your drivers' wall</text>
  <text x="20" y="56" fill="#444">The centre of the field is (0, 0). Each tile is 24 in. The field is 144 in (6 tiles) each way.</text>

  <!-- ===================== the field: 144 in = 360 px, centre (220, 290) ===================== -->
  <text x="220" y="94" text-anchor="middle" fill="#555" font-size="13">the far wall</text>
  <rect x="40" y="110" width="360" height="360" fill="#f4f4f4" stroke="#333" stroke-width="3"/>
  <!-- tile seams every 60 px -->
  <g stroke="#cfcfcf" stroke-width="1">
    <line x1="100" y1="110" x2="100" y2="470"/><line x1="160" y1="110" x2="160" y2="470"/>
    <line x1="280" y1="110" x2="280" y2="470"/><line x1="340" y1="110" x2="340" y2="470"/>
    <line x1="40" y1="170" x2="400" y2="170"/><line x1="40" y1="230" x2="400" y2="230"/>
    <line x1="40" y1="350" x2="400" y2="350"/><line x1="40" y1="410" x2="400" y2="410"/>
  </g>
  <!-- centre lines -->
  <line x1="220" y1="110" x2="220" y2="470" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="40" y1="290" x2="400" y2="290" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- your drivers' wall -->
  <rect x="40" y="470" width="360" height="12" fill="#1f5fa8"/>
  <text x="220" y="504" text-anchor="middle" font-weight="bold" fill="#1f5fa8">YOUR DRIVERS' WALL</text>
  <text x="220" y="524" text-anchor="middle" fill="#555" font-size="13">you stand here and look up the page</text>

  <!-- axes from the centre -->
  <line x1="220" y1="290" x2="330" y2="290" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a)"/>
  <text x="318" y="312" fill="#1f5fa8" font-weight="bold">x +</text>
  <line x1="220" y1="290" x2="220" y2="180" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a)"/>
  <text x="228" y="196" fill="#1f5fa8" font-weight="bold">y +</text>
  <circle cx="220" cy="290" r="5" fill="#1f5fa8"/>
  <text x="228" y="308" fill="#1f5fa8" font-size="13">(0, 0)</text>

  <!-- edge numbers -->
  <text x="40" y="106" text-anchor="middle" fill="#555" font-size="12">-72</text>
  <text x="400" y="106" text-anchor="middle" fill="#555" font-size="12">72</text>
  <text x="408" y="474" fill="#555" font-size="12">-72</text>
  <text x="408" y="118" fill="#555" font-size="12">72</text>
  <text x="408" y="294" fill="#555" font-size="12">0</text>

  <!-- start spot: (-56, -61), heading 0 -> (80, 442.5); robot 18 in = 45 px -->
  <rect x="57.5" y="420" width="45" height="45" rx="5" fill="#eef2f8" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="452" x2="80" y2="427" stroke="#333" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="110" y="440" fill="#222" font-size="13" font-weight="bold">start</text>
  <text x="110" y="456" fill="#222" font-size="13" font-family="Menlo, Consolas, monospace">(-56, -61), 0</text>

  <!-- a driveTo point: (-30, -30), heading 45 -> (145, 365) -->
  <circle cx="145" cy="365" r="6" fill="#2d7a32"/>
  <line x1="145" y1="365" x2="120" y2="340" stroke="#2d7a32" stroke-width="3" marker-end="url(#g)"/>
  <text x="155" y="372" fill="#2d7a32" font-size="13" font-weight="bold">driveTo</text>
  <text x="155" y="388" fill="#2d7a32" font-size="13" font-family="Menlo, Consolas, monospace">(-30, -30), 45</text>

  <!-- divider -->
  <line x1="440" y1="80" x2="440" y2="540" stroke="#ccc" stroke-width="2"/>

  <!-- ===================== right: the three numbers ===================== -->
  <text x="460" y="104" font-weight="bold" fill="#222">x: left and right</text>
  <text x="460" y="126" fill="#444">inches right of the centre line.</text>
  <text x="460" y="146" fill="#444">Minus = left of it.</text>

  <text x="460" y="184" font-weight="bold" fill="#222">y: toward the far wall</text>
  <text x="460" y="206" fill="#444">inches from the centre toward the far wall.</text>
  <text x="460" y="226" fill="#444">Minus = your half of the field.</text>

  <text x="460" y="264" font-weight="bold" fill="#222">heading: the way the robot faces</text>
  <!-- small compass -->
  <circle cx="545" cy="355" r="55" fill="none" stroke="#9cc49f" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="545" y1="355" x2="545" y2="306" stroke="#2d7a32" stroke-width="3" marker-end="url(#g)"/>
  <text x="545" y="292" text-anchor="middle" fill="#2d7a32" font-weight="bold">0</text>
  <line x1="545" y1="355" x2="496" y2="355" stroke="#2d7a32" stroke-width="3" marker-end="url(#g)"/>
  <text x="484" y="360" text-anchor="end" fill="#2d7a32" font-weight="bold">90</text>
  <text x="545" y="430" text-anchor="middle" fill="#2d7a32" font-weight="bold">180</text>
  <text x="608" y="360" fill="#2d7a32" font-weight="bold">-90</text>
  <text x="650" y="318" fill="#444" font-size="13">0 = away from</text>
  <text x="650" y="334" fill="#444" font-size="13">your wall</text>
  <text x="650" y="356" fill="#444" font-size="13">counterclockwise:</text>
  <text x="650" y="372" fill="#444" font-size="13">90 = left</text>

  <text x="460" y="472" font-weight="bold" fill="#222">Write every number for BLUE.</text>
  <text x="460" y="494" fill="#444">BIOBUZZ: RED uses the same numbers,</text>
  <text x="460" y="514" fill="#444">seen from the red drivers' wall.</text>
</svg>
