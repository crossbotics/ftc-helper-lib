<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">One interlock rule: "TurretLift" (the V2 robot)</text>

  <!-- ===== Top view ===== -->
  <text x="40" y="58" font-weight="bold" fill="#444">Seen from above</text>
  <!-- robot body: 18 in square -->
  <rect x="90" y="100" width="260" height="260" fill="#f4f6fa" stroke="#888" stroke-width="2"/>
  <text x="185" y="92" fill="#666">front</text>
  <text x="188" y="380" fill="#666">back</text>
  <!-- lifter band at the back (2 in) -->
  <rect x="90" y="331" width="260" height="29" fill="#e3ecd9" stroke="#6b8f4e" stroke-width="1"/>
  <!-- slide in the back-left corner, claw at the back centre -->
  <rect x="104" y="333" width="18" height="25" fill="#6b8f4e"/>
  <rect x="200" y="336" width="40" height="20" fill="#6b8f4e"/>
  <text x="372" y="350" fill="#4a6b33">lift: slide (left corner)</text>
  <text x="372" y="367" fill="#4a6b33">and claw (back centre)</text>
  <line x1="368" y1="352" x2="244" y2="346" stroke="#6b8f4e" stroke-width="1"/>
  <!-- turret circle -->
  <circle cx="220" cy="230" r="110" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- the turret's zone: 130 to 218 deg (0 = forward, counterclockwise +) -->
  <path d="M220,230 L135.7,300.7 A110 110 0 0 0 287.7,316.7 Z" fill="#f6c9a6" fill-opacity="0.85" stroke="#c0622b" stroke-width="1.5"/>
  <text x="372" y="292" fill="#a0481a" font-weight="bold">turret's zone: 130 to 218 deg</text>
  <text x="372" y="309" fill="#a0481a">(the back, plus the turret's width)</text>
  <line x1="368" y1="296" x2="262" y2="300" stroke="#c0622b" stroke-width="1"/>
  <!-- turret pointing forward -->
  <circle cx="220" cy="230" r="9" fill="#1f4e9c"/>
  <line x1="220" y1="230" x2="220" y2="140" stroke="#1f4e9c" stroke-width="3" marker-end="url(#a)"/>
  <text x="228" y="150" fill="#1f4e9c" font-weight="bold">0 deg</text>
  <text x="110" y="234" fill="#555">+90</text>
  <text x="304" y="234" fill="#555">-90</text>
  <text x="208" y="327" fill="#a0481a">180</text>

  <!-- ===== Side view ===== -->
  <text x="560" y="58" font-weight="bold" fill="#444">The lift, from the side</text>
  <line x1="520" y1="420" x2="740" y2="420" stroke="#888" stroke-width="2"/>
  <text x="680" y="438" fill="#666">tiles</text>
  <!-- fixed stage and moving stage -->
  <rect x="600" y="230" width="22" height="190" fill="#c9d8bb" stroke="#6b8f4e"/>
  <rect x="626" y="150" width="22" height="190" fill="#6b8f4e"/>
  <!-- the lift's zone line -->
  <rect x="580" y="90" width="100" height="250" fill="#f6c9a6" fill-opacity="0.45"/>
  <line x1="570" y1="340" x2="700" y2="340" stroke="#c0622b" stroke-width="2.5"/>
  <text x="520" y="362" fill="#a0481a" font-weight="bold">liftAbove = 270 counts (84 mm)</text>
  <text x="586" y="110" fill="#a0481a" font-weight="bold">lift's zone</text>
  <!-- where a held lift waits -->
  <line x1="570" y1="380" x2="700" y2="380" stroke="#1f4e9c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="400" fill="#1f4e9c">held: waits 2 margins below (110)</text>

  <!-- the rule -->
  <rect x="20" y="404" width="470" height="56" rx="6" fill="#fff8e6" stroke="#d9b45a"/>
  <text x="32" y="426" fill="#222">Never both in their zones. The one in its zone first keeps it;</text>
  <text x="32" y="446" fill="#222">the other waits outside its own zone until the first one leaves.</text>
</svg>
