<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d7a32"/>
    </marker>
  </defs>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">The laptop, the Control Hub and the Driver Hub</text>

  <!-- laptop -->
  <rect x="20" y="70" width="200" height="130" rx="10" fill="#eef2f8" stroke="#333" stroke-width="2"/>
  <text x="120" y="98" text-anchor="middle" font-weight="bold" fill="#222">Laptop</text>
  <text x="120" y="124" text-anchor="middle" fill="#333">Android Studio</text>
  <text x="120" y="146" text-anchor="middle" font-size="13" fill="#555">you write and build</text>
  <text x="120" y="164" text-anchor="middle" font-size="13" fill="#555">the code here</text>

  <!-- control hub -->
  <rect x="290" y="70" width="200" height="130" rx="10" fill="#eef2f8" stroke="#333" stroke-width="2"/>
  <text x="390" y="98" text-anchor="middle" font-weight="bold" fill="#222">Control Hub</text>
  <text x="390" y="124" text-anchor="middle" fill="#333">Robot Controller app</text>
  <text x="390" y="146" text-anchor="middle" font-size="13" fill="#555">with your code in it</text>
  <text x="390" y="164" text-anchor="middle" font-size="13" fill="#555">(on the robot)</text>

  <!-- driver hub -->
  <rect x="560" y="70" width="140" height="130" rx="10" fill="#eef2f8" stroke="#333" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-weight="bold" fill="#222">Driver Hub</text>
  <text x="630" y="124" text-anchor="middle" fill="#333">Driver Station</text>
  <text x="630" y="146" text-anchor="middle" font-size="13" fill="#555">INIT, ▶, STOP</text>

  <!-- laptop -> control hub -->
  <line x1="222" y1="120" x2="286" y2="120" stroke="#1f4e9c" stroke-width="4" marker-end="url(#a)"/>
  <text x="254" y="226" text-anchor="middle" font-size="13" fill="#1f4e9c" font-weight="bold">install (Run)</text>
  <text x="254" y="244" text-anchor="middle" font-size="13" fill="#1f4e9c">USB cable or Wi-Fi</text>
  <line x1="254" y1="212" x2="254" y2="128" stroke="#1f4e9c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- control hub <-> driver hub -->
  <line x1="494" y1="120" x2="556" y2="120" stroke="#2d7a32" stroke-width="4" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="525" y="226" text-anchor="middle" font-size="13" fill="#2d7a32" font-weight="bold">Wi-Fi</text>
  <line x1="525" y1="212" x2="525" y2="128" stroke="#2d7a32" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- what plugs in -->
  <text x="390" y="290" text-anchor="middle" fill="#333">motors, servos, sensors plug in</text>
  <line x1="390" y1="272" x2="390" y2="204" stroke="#333" stroke-width="2"/>
  <text x="630" y="290" text-anchor="middle" fill="#333">gamepads plug in</text>
  <line x1="630" y1="272" x2="630" y2="204" stroke="#333" stroke-width="2"/>

  <!-- simulator -->
  <rect x="20" y="300" width="200" height="80" rx="10" fill="#fff8e6" stroke="#b07a00" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="120" y="328" text-anchor="middle" font-weight="bold" fill="#222">Simulator</text>
  <text x="120" y="350" text-anchor="middle" font-size="13" fill="#555">a pretend robot on the laptop:</text>
  <text x="120" y="368" text-anchor="middle" font-size="13" fill="#555">no hubs needed</text>
  <line x1="120" y1="204" x2="120" y2="296" stroke="#b07a00" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
