// ftc-helper-lib: the library module.
// A robot project includes this folder as a Gradle module (see docs/01-add-to-project.md).
// The plugin version comes from the robot project's own build.gradle.
plugins {
    id 'com.android.library'
}

// The FTC SDK version this library is built and tested against.
// The robot project brings its own SDK, and the robot app runs with that one (compileOnly below).
def ftcSdkVersion = '12.0.0'

android {
    namespace 'com.crossbotics.ftchelper'
    compileSdk 30

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        // Same as the FTC SDK (build.common.gradle).
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        // Android classes do nothing in plain unit tests instead of throwing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // compileOnly: the robot project already has the SDK, so we do not bundle a second copy.
    compileOnly "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:Vision:$ftcSdkVersion"

    testImplementation "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Vision:$ftcSdkVersion"
    testImplementation 'junit:junit:4.13.2'
}

// The reference: every public class and method as web pages with a search box.
//   ./gradlew :library:reference      (then open library/build/reference/index.html)
// Only made when asked for; a robot project's build never runs it.
android.libraryVariants.configureEach { variant ->
    if (variant.name != 'debug') return
    tasks.register('reference', Javadoc) {
        group = 'documentation'
        description = 'Makes the searchable reference (web pages) of every public class and method.'
        def compile = variant.javaCompileProvider.get()
        source = compile.source
        classpath = files(compile.classpath) + files(android.bootClasspath)
        destinationDir = layout.buildDirectory.dir('reference').get().asFile
        title = "ftc-helper-lib reference"
        options.encoding = 'UTF-8'
        options.windowTitle = 'ftc-helper-lib reference'
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('html5', true)
        // The pages ask for a web-font file this javadoc does not write: an empty one stops the 404.
        doLast {
            def font = new File(destinationDir, 'resources/fonts/dejavu.css')
            font.parentFile.mkdirs()
            if (!font.exists()) font.text = '/* no web font: the pages use the browser\'s own */\n'
        }
    }
}
