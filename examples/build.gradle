// Example OpModes. This module is only built in the standalone build, to prove
// the examples compile. Robot projects do not include it: copy an example into
// TeamCode and remove its @Disabled line to use it.
plugins {
    id 'com.android.library'
}

def ftcSdkVersion = '12.0.0'

android {
    namespace = 'com.crossbotics.ftchelper.examples'
    compileSdk = 30

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // A failed test shows its whole message in the console (CI's log), not only "AssertionError at line N".
        unitTests.all {
            testLogging {
                events 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    implementation project(':library')
    // The Pedro bot example (examples/pedrobot) uses the pedro module.
    implementation project(':pedro')
    compileOnly "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    compileOnly "org.firstinspires.ftc:Vision:$ftcSdkVersion"

    // Tutorial 13: tests for team code.
    testImplementation "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Vision:$ftcSdkVersion"
    testImplementation 'junit:junit:4.13.2'
}

// Java 8 is what the robot needs; the newer Java that builds it warns "source value 8 is obsolete" on
// every module. A known, harmless warning: hidden, so a real problem stands out.
tasks.withType(JavaCompile).configureEach { options.compilerArgs.add("-Xlint:-options") }
