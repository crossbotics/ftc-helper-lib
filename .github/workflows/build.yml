name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    # docs-live is the last release (its code passed this job as the release) plus docs-only fixes:
    # it gets the docs job below instead (docs/contributing.md, "Docs fixes between releases").
    if: github.ref_name != 'docs-live' && github.base_ref != 'docs-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests, examples and tutorial programs
        run: ./gradlew --no-daemon :library:testDebugUnitTest :examples:assembleDebug :examples:testDebugUnitTest
      - name: Simulator tests (whole OpModes with pretend hardware)
        run: ./gradlew --no-daemon :sim:testDebugUnitTest
      - name: Docs and tutorials check
        run: python3 tools/check_docs.py
      - name: Parts page up to date
        run: python3 tools/parts_page.py --check
      - name: Non-blocking check
        run: python3 tools/check_blocking.py
      - name: Tunables reference check (every field the code reads is documented)
        run: python3 tools/check_tunables.py
      - name: Auto builder page code (same Java as the web builder, simulator-only logic)
        run: node tools/check_builder.mjs
      - name: Test list (testing/tests) and its catalogue
        run: python3 tools/check_tests.py

  docs:
    # docs-live only: its docs fixes are checked against the released code, without the Gradle build.
    if: github.ref_name == 'docs-live' || github.base_ref == 'docs-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs and tutorials check
        run: python3 tools/check_docs.py
      - name: Test list (testing/tests) and its catalogue
        run: python3 tools/check_tests.py
