# REV DUO FTC Starter Bot, 2026-27 (BIOBUZZ): a test robot for the simulator.
# Only our own numbers: no CAD from REV is in this repository.
#
# Sources (read 2026-10-16):
#   [page]  https://www.revrobotics.com/duo/ftc-starter-bot/
#   [guide] 2026-27 REV DUO FTC Starter Bot Build Guide (PDF, 126 pages), linked from [page]
#   [code]  https://docs.revrobotics.com/ftc-kickoff-concepts/home/programming-teleop-and-auto
#           (TeleOp code and configuration walkthrough)
# The Onshape CAD needs a sign-in, so nothing here is measured in it. Sizes marked "est." are worked out
# from part lengths in [guide] and its pictures; they are not on any REV page. See docs/guides/starter-bots.md.

battery = 12.8

# ---- Field and robot ----
field = biobuzz-2026
# est.: 408 mm C-channel drive rails + a 15 mm extrusion at each end = 438 mm long; 420 mm cross
# extrusions, with the wheels just outside the rails ([guide] drivetrain steps) = about 17.2 in wide.
robot.lengthIn = 17.2
robot.widthIn = 17.2
# est.: the launcher sits on 323 mm uprights above the drive rails ([guide] "Launcher and Feeder Assembly").
robot.heightIn = 15
# Back against the red wall (inside face at y = -70.585, field file): -70.5 + 17.2 / 2. x as in the library's starter robot.
start.x = -56
start.y = -61.9
start.heading = 0

# ---- Drivetrain ----
# [guide]: 6 wheels, 3 per side (90 mm omni on the motor shaft, 90 mm grip in the middle, 90 mm traction),
# one 20:1 UltraPlanetary HD Hex motor per side, 10-tooth to 10-tooth #25 chain (1:1).
# [code]: "leftDrive" and "rightDrive" (Motor 0 and 1), arcade drive on the left stick.
drive.type = tank
drive.motors = leftDrive, rightDrive
# 20:1 UltraPlanetary = 5:1 + 4:1 cartridges ([guide]); the catalog has the real 18.93:1.
drive.part = rev-hd-hex-up20
drive.wheelDiameterIn = 3.54           # 90 mm wheels ([guide] BOM: REV-41-1190, -1354, -1267)
drive.gearRatio = 1                    # 10T to 10T sprockets ([guide])
drive.trackWidthIn = 15.5              # est.: wheel centres, from the rail spacing (248 mm C-channels between rails)
drive.wheelBaseIn = 12                 # est.: front to back wheel, on 408 mm rails
imu = imu

# ---- Motors ----
# Intake: Core Hex motor on the lower intake shaft, chained 20T to 20T to the upper shaft ([guide] "Intake Assembly").
# [code]: "intakeMotor" (Motor 2); Right Bumper takes POLLEN in, Right Trigger reverses. Which sign of power
# takes in is not stated: the simulator's default (positive = in) is used.
motor.intakeMotor = free, part=rev-core-hex
# Launcher: HD Hex motor with a 1:1 UltraPlanetary output, two 90 mm grip wheels on its shaft ([guide]
# "Launcher Flywheel Assembly"). [code]: "flywheel" (Motor 3), Y spins it up "to the target velocity"
# (the number is not on the page).
motor.flywheel = flywheel, part=rev-hd-hex

# ---- Servos ----
# Feeder: Smart Robot Servo V2 (Balanced) in CR mode, 60T to 60T gear to a roller of four 1 in grip wheels
# ([guide] "Feeder Servo/Roller"). [code]: "crServo" (Servo 0, Continuous), D-pad up/down by hand.
crservo.crServo =
# Pollen pusher ("poker"): Smart Robot Servo V2 (Balanced) with an extrusion arm on the side of the robot
# ([guide] "Pollen Pusher Assembly"). [code]: "pollenServo" (Servo 1), A = preset down, B = preset up;
# the preset numbers are not on the page. It starts at 0 (folded) so the robot fits the 18 in start cube.
servo.pollenServo = 0, part=rev-smart-servo-v2-balanced

# ---- Shapes (3D view and the size rules) ----
# est.: the drive rails are 45 mm C-channel around 90 mm wheels: about 3.6 in tall.
robot.chassisHeightIn = 3.6
# Intake: two 308 mm hex shafts of flap wheels across the front ([guide]); size and place est. from the pictures.
shape.intake = roller, at=7.6,0,2.5, size=2.5x12x2.5, motor=intakeMotor
# The launcher's frame: 323 mm uprights and a 218 mm cross piece ([guide]); a fixed box, est. from the pictures.
shape.tower = box, at=-3,0,3.6, size=4x8.6x9
# The flywheel: two 90 mm grip wheels on a 252 mm shaft ([guide]), on top of the tower.
shape.launcher = flywheel, at=-3,0,13.2, size=3.5x2x3.5, motor=flywheel
# The feeder roller: four 1 in grip wheels just in front of the flywheel ([guide]); place est.
shape.feeder = roller, at=-0.5,0,12.6, size=1x8x1, crservo=crServo
# The pollen pusher: a 63 + 83 mm extrusion arm on a servo at the left side ([guide]). The real arm swings
# up and down out to the side; the simulator's arm always reaches forward from its hinge, so here it turns
# about "up": 0 = folded along the side, 90 degrees = straight out to the left (positions are a guess).
shape.pusher = arm, at=3,8.1,4, size=3.3x0.6x0.6, axis=up, servo=pollenServo, pos0=0, pos1=90

# ---- Game pieces ----
# [page] and [code]: it collects POLLEN from the floor, launches it into the HIVE, and combs POLLEN out of a
# FLOWER with the poker. Capacity is not stated; 4 is the game's limit.
collect.intake = shape=intake, motor=intakeMotor, holds=4
# Not modelled: the shot. Its CR servo feeder could be feeder=crServo, but the launch angle and speed are not
# published, so there is no shoot. line yet.

# ---- MEASURE stand-ins (simulator only) ----
# Tunables.PollenServo up and down are MEASURE in the code: the real robot stops at INIT until the Servo
# Finder gives them. The simulator uses these numbers in their place (the guesses the code had before).
tunable.PollenServo.up = 0.0
tunable.PollenServo.down = 0.5
