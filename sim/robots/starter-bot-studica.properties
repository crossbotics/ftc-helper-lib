# Studica FTC Starter Bot, 2026-27 (BIOBUZZ): a test robot for the simulator.
# Only our own numbers: no CAD from Studica is in this repository.
#
# Sources (read 2026-10-16):
#   [page]  https://www.studica.com/ftc-starter-bot-resource-guide-2026-2027
#   [guide] Studica Starter Bot 2026/2027 Build Guide, version 1.0 of 12 Sept 2026 (PDF, 64 pages), linked from [page]
#   [code]  "BIOBUZZ Starter Bot Blocks Code" (a JPG picture of the Blocks program), linked from [page]
#   [motor] https://www.studica.com/maverick-planetary-dc-gear-motor-wencoder-5091-ratio-gearbox
#           (its table lists every Maverick ratio: speed and encoder counts)
# The STEP CAD download is behind a browser check, so nothing here is measured in it. Sizes marked "est."
# are worked out from part lengths in [guide] and the robot photo on [page]. See docs/guides/starter-bots.md.

battery = 12.8

# ---- Field and robot ----
field = biobuzz-2026
# est.: 336 mm side U-channels ([guide] step 3), about 14 in with the intake; 192 mm cross channels between
# 48 mm side channels, with the drive and omni wheels outside them: about 15 in wide.
robot.lengthIn = 14
robot.widthIn = 15
# est.: the flywheel frame is 96 mm extrusions under a 144 mm U-channel ([guide] step 20), on the drive base.
robot.heightIn = 13
# Back against the red wall (inside face at y = -70.585, field file): -70.5 + 14 / 2. x as in the library's starter robot.
start.x = -56
start.y = -63.5
start.heading = 0

# ---- Drivetrain ----
# [guide] steps 10-14: two 100 mm drive wheels at the front, each on a Maverick 50.9:1 motor through a pair of
# 36-tooth bevel gears (1:1); two free-spinning omni wheels at the back. [code]: "leftDrive" and "rightDrive",
# tank drive (left stick y and right stick y); leftDrive is REVERSE.
drive.type = tank
drive.motors = leftDrive, rightDrive
# The Maverick motor is not in the parts catalog. [motor]: 50.9:1 = 119.84 rpm, 1221.6 counts per output turn;
# 119.84 x 1221.6 / 60 = 2440 counts/s.
drive.maxTicksPerSec = 2440
drive.ticksPerRev = 1221.6
drive.wheelDiameterIn = 3.94           # 100 mm drive wheel ([guide] step 14 and 21)
drive.gearRatio = 1                    # 36T to 36T bevel gears ([guide] steps 11-12)
drive.trackWidthIn = 13.5              # est.: wheel centres, outside the 192 mm frame
drive.wheelBaseIn = 11                 # est.: front drive wheel to back omni wheel
imu = imu

# ---- Motors ----
# Intake: Maverick 3.7:1 through 36T to 36T bevel gears to a 260 mm shaft of four 50 mm wheels ([guide] steps 15-19).
# [motor]: 3.7:1 = 1648.65 rpm, 88.8 counts per turn. [code]: "Intake", Right Bumper = power 1, Left Bumper = -1.
motor.Intake = free, rpm=1648.65, ticksPerRev=88.8
# Flywheel: Maverick 1:1 with a 13-tooth bevel gear driving a 26-tooth one (2:1 slower) on a shaft of three
# 100 mm wheels ([guide] steps 21-32). [motor]: 1:1 = 6100 rpm, 24 counts per turn. [code]: "FlyWheel",
# power = right trigger.
motor.FlyWheel = flywheel, rpm=6100, ticksPerRev=24

# ---- Servos ----
# [guide] steps 24-26 and 39: a Multi-Mode Smart Servo with a 29 x 4 hole polycarbonate flap on its hub pushes
# POLLEN into the flywheel. [code]: "fwActuator", X = position 0, A = position 0.2. The servo is not in the parts
# catalog and its speed is not on [page]: it moves at servo.speed.
servo.speed = 1.2
servo.fwActuator = 0

# ---- Shapes (3D view and the size rules) ----
# est.: 48 mm channels on the drive base, with the 100 mm wheels reaching above them: about 4 in.
robot.chassisHeightIn = 4
# Intake: four 50 mm wheels on a 260 mm shaft across the front ([guide] step 17).
shape.intake = roller, at=6,0,1.6, size=2x10.2x2, motor=Intake
# The hood: a 37 x 12 hole polycarbonate sheet from the flywheel frame to a beam at the front ([guide] steps
# 37-38); a fixed box here, size est. from the photo on [page].
shape.hood = box, at=1,0,4, size=8x7.6x7
# The flywheel: three 100 mm wheels on a 140 mm shaft at the back ([guide] step 32), on top of its frame.
shape.flywheel = flywheel, at=-4,0,11, size=4x4.5x4, motor=FlyWheel

# ---- Game pieces ----
# [guide] step 44: the panels "funnel" game pieces from the intake to the flywheel actuator. Capacity is not
# stated; 4 is the game's limit.
collect.intake = shape=intake, motor=Intake, holds=4
# Not modelled: the shot. The simulator fires a shot only while a MOTOR named by the flywheel's feeder= runs,
# and this robot feeds with a servo flap. The simulator also takes the flywheel's rim speed straight from the
# motor (no gear between them): with a shoot. line, share= would have to be halved for the 2:1 bevel gears.
# The launch direction and angle are not published.
