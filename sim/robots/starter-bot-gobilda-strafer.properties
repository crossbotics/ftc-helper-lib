# goBILDA FTC StarterBot with Mecanum Wheels (for BIOBUZZ), 2026-27: a test robot for the simulator.
# Only our own numbers: no CAD from goBILDA is in this repository.
#
# Sources (read 2026-11-09):
#   [page]   https://www.gobilda.com/ftc-starterbot-with-mecanum-wheels-resource-guide-2026-2027/
#            (needs the 2026-2027 FTC Starter Kit, a Strafer Chassis Kit and two Flat Pattern Mounts)
#   [strafer] https://www.gobilda.com/strafer-chassis-kit-104mm-gripforce-mecanum-wheels/ (3209-0001-0007)
#   [code]   3200-2627-0004_example-code.zip from [page]: BioBuzzStarterbotTeleopMecanum.java (a TeleOp only)
#   [cad]    3200-2627-0004.zip from [page] (STEP). Measured on a laptop with tools/cad/robot_cad.py (part
#            bounding boxes); only the resulting numbers are written here. In the CAD the robot points along -Y,
#            its left is +X, the frame is centred on 0, and the wheels touch the tiles at z = -52 mm.
# See docs/guides/starter-bots.md.

battery = 12.8

# ---- Field and robot ----
field = biobuzz-2026
# [cad]: the two 15-hole U-channel side rails (1120-0015-0384) are 384 mm long (15.1 in); the mecanum wheels'
# outside faces are 452 mm apart (17.8 in). The whole robot: 452 mm (17.8 in) front to back with the corner
# wheels, 309 mm (12.2 in) tall (top of the hood gridplate and the towers).
robot.lengthIn = 15.1
robot.widthIn = 17.8
robot.heightIn = 12.2
# Back against the red wall (inside face at y = -70.585, field file): -70.5 + 15.1 / 2. x as in the library's starter robot.
start.x = -56
start.y = -62.95
start.heading = 0

# ---- Drivetrain ----
# [strafer]: four 312 RPM Yellow Jackets (5203-2402-0019) turning the wheels through steel miter gears (1:1),
# four 104 mm GripForce mecanum wheels. [code]: "left_front_drive", "right_front_drive", "left_back_drive",
# "right_back_drive"; the two left motors REVERSE, the right ones FORWARD.
drive.type = mecanum
drive.mirrored = left                  # [code]: the left motors are REVERSE
drive.motors = left_front_drive, right_front_drive, left_back_drive, right_back_drive
drive.part = gobilda-5203-312
drive.wheelDiameterIn = 4.09           # 104 mm
drive.gearRatio = 1
drive.trackWidthIn = 16.34             # [cad]: wheel centres 415 mm apart
drive.wheelBaseIn = 10.16              # [cad]: front axle to back axle, 258 mm (the wheels sit 24 mm behind the frame's centre)
imu = imu

# ---- Motors ----
# Intake: a 50.9:1 Yellow Jacket (5203-2402-0051) turning a shaft of seven 48 mm GripForce Gecko wheels, as on the
# 6WD StarterBot. [code]: "intake", power = right trigger - left trigger.
motor.intake = free, part=gobilda-5203-117
# Launcher: a 19.2:1 Yellow Jacket converted to 1:1 (the Starter Kit's 1:1 Conversion Kit) driving one 96 mm Hogback
# wheel. [code]: "launcher", setVelocity(1250) counts/s while right bumper is held (about 2680 rpm at 28 counts per
# turn); the feeder runs once it is above 1200: the "windmillServo" CR servo.
motor.launcher = flywheel, part=gobilda-5203-6000, feeder=windmillServo

# ---- Servos ----
# [cad]: two 2000 Series Dual Mode servos (Speed, 2000-0025-0003) turn the 72 mm Gecko wheels at the intake's front
# corners; one 2000 Series (Torque, 2000-0025-0002) turns the windmill feeder. [code]: all three are CRServos:
# "left_intake_servo", "right_intake_servo" (REVERSE), "windmillServo" (REVERSE).
crservo.left_intake_servo =
crservo.right_intake_servo =
crservo.windmillServo =

# ---- Shapes (3D view and the size rules); [cad] numbers, mm / 25.4 ----
# The chassis box: the side rails and wheels, up to the top of the 104 mm wheels.
robot.chassisHeightIn = 4.1
# Intake: seven 48 mm Gecko wheels over 184 mm of shaft, centred 185 mm ahead of the frame centre, 9 mm right, 88 mm up.
shape.intake = roller, at=7.28,-0.35,3.46, size=1.89x7.24x1.89, motor=intake
# The two 72 mm Gecko wheels lie flat (they turn about "up") at the front corners, 224 mm ahead, 156 mm out, 39 mm up.
# Which side the code's "left" servo is on is not stated: here it is the robot's left.
shape.left_wheel = roller, at=8.82,6.14,1.54, size=2.83x2.83x0.94, axis=up, crservo=left_intake_servo
shape.right_wheel = roller, at=8.82,-6.14,1.54, size=2.83x2.83x0.94, axis=up, crservo=right_intake_servo
# The two upright 10-hole U-channels behind the launcher (264 mm tall, from 44 mm up), 88 mm behind the centre.
shape.tower = box, at=-3.46,0,1.73, size=1.89x7.24x10.39
# The launcher wheel: 96 mm Hogback, centred 40 mm behind the frame centre, 5 mm right and 172 mm up.
shape.launcher = flywheel, at=-1.57,-0.2,6.77, size=3.78x0.94x3.78, motor=launcher
# The hood: the large gridplate (1117-0216-0352) over the launcher, 175 to 307 mm up (a box here; the real one is tilted).
shape.hood = box, at=1.04,0,6.89, size=7.13x6.93x5.2

# ---- Game pieces ----
# [page]: a GripForce Gecko wheel intake and a shooter for POLLEN, as on the 6WD StarterBot (carries up to four).
# A NECTAR is too big for it (limits=NECTAR:0): the intake does not take one in.
collect.intake = shape=intake, motor=intake, holds=4, limits=NECTAR:0
# The shot: [cad]'s hood gridplate is tilted 37 degrees from flat (its face points 0.6 forward, 0.8 up), rising toward
# the back, with the launcher wheel under its back end. So a shot leaves up and BACKWARD:
# angle = 180 - 37 = 143 degrees from the robot's forward. est.: the real exit angle and speed are not published;
# share=0.5 (half the wheel's rim speed) is the simulator's default.
shoot.launcher = shape=launcher, angle=143, share=0.5
