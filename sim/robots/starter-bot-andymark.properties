# AndyMark Robits BIOBUZZ StarterBot, 2026-27: a test robot for the simulator.
# Only our own numbers: no CAD from AndyMark is in this repository.
#
# Sources (read 2026-10-16):
#   [page]   https://andymark.com/products/robits-biobuzz-starterbot (kit parts list, am-5832)
#   [base]   https://andymark.com/pages/2026-2027-robits-starterbot-base (links to everything below)
#   [guide]  BIOBUZZ_StarterBot_Guide_REV1.pdf (assembly guide, 42 pages, revision of 2026-09-23)
#   [manual] FTC_BIOBUZZ_Robits_StarterBot_User_Manual.pdf (22 pages)
#   [code]   RobitsStarterBotTeleop.java
#   [cad]    "Robits BIOBUZZ Robot.STEP" (the roller flower mechanism). Measured on a laptop with build123d
#            (bounding boxes of its 7 subassemblies); only the resulting numbers are written here. In the CAD
#            +Y is up (the wheels touch the tiles at Y = -80.1 mm), +Z points to the intake (the front) and +X to
#            the robot's left. The drivetrain's own guide (ROBITS Starter Chassis) was not read.
# Conversions below: forward = (Z + 291.65) / 25.4, left = (X - 240.1) / 25.4, up = (Y + 80.1) / 25.4
# (the chassis box's middle). See docs/guides/starter-bots.md.

battery = 12.8

# ---- Field and robot ----
field = biobuzz-2026
# [cad] chassis subassembly: 393.7 mm front to back (15.5 in), 367.6 mm across (14.5 in), 120.6 mm tall.
# The whole robot: 437.9 x 449.3 mm (17.2 x 17.7 in), 444.5 mm (17.5 in) tall (the launcher frame).
robot.lengthIn = 15.5
robot.widthIn = 14.5
robot.heightIn = 17.5
# Back against the red wall (inside face at y = -70.585, field file). The launcher frame reaches 7.9 in behind
# the chassis middle ([cad]), further than the chassis (7.75 in): -70.5 + 7.94.
start.x = -56
start.y = -62.55
start.heading = 0

# ---- Drivetrain ----
# [manual]: "Simple Skid-Steer Chassis", belts, powered omni wheels. [page]: 2 x 3 in Stealth wheels (am-4718),
# 2 x 3 in omni wheels (am-4967a), 2 x NeveRest 19.2:1 hex gearmotors, 121-tooth belts. [cad]: each side has
# its motor's 40-tooth gear driving a 40-tooth gear (1:1) and a belt to the other wheel.
# [code]: "left_drive" (FORWARD), "right_drive" (REVERSE); split arcade by default (left stick drive, right stick turn).
drive.type = tank
drive.mirrored = right                 # [code]: right_drive is REVERSE, left_drive FORWARD
drive.motors = left_drive, right_drive
# The kit's NeveRest Hex 19.2:1 (am-5442 on [page], am-5550-0100-019 in [cad]) is the same motor and ratio as
# the catalog's NeveRest Orbital 20 (AndyMark's page labels it "~344 RPM", like the catalog).
drive.part = am-neverest-orbital-20
drive.wheelDiameterIn = 3.0
drive.gearRatio = 1
# [cad]: the front and back wheel centres on a side are 266.7 mm apart.
drive.wheelBaseIn = 10.5
# est.: wheels just inside the 367.6 mm chassis (each side's CAD is in its own frame, so not measured).
drive.trackWidthIn = 13
imu = imu

# ---- Motors ----
# Launcher: a "coaxial flinger" (catapult) wound and fired by one NeveRest 50.9:1 (am-5443) through 40T to 40T
# gears, powered by rubber bands ([manual], [guide] launcher steps 12-21). [code]: "catapult" (REVERSE), power 0.65
# while the right trigger is held. A free-spinning motor here: the simulator has no catapult (see the notes below).
motor.catapult = free, part=am-neverest-orbital-50

# ---- Servos ----
# Intake rollers: rubber bands on gear "rollers", turned by a High Speed programmable servo (am-4955a) in
# continuous mode ([guide] intake steps 1-27). [code]: "rollerI" (REVERSE), left bumper = in (+1), right = out.
crservo.rollerI =
# Flower mechanism, roller version: a trimmed 2 in compliant wheel on a continuous servo ([manual] p. 12).
# [code]: "rollerF", runs with the intake.
crservo.rollerF =
# Flower mechanism, stick version (the other CAD file): a positional servo. [code]: "stick", 0.46 = in, 0.65 = out.
# Not drawn here: the roller version is. These servos are not in the parts catalog: they move at servo.speed.
servo.speed = 1.2
servo.stick = 0.46

# ---- Shapes (3D view and the size rules); [cad] subassembly boxes ----
robot.chassisHeightIn = 4.75
# The intake subassembly (rollers, gears, backstop), 3.6 to 9.3 in ahead of the middle, 0.3 to 7.8 in up.
shape.intake_frame = box, at=6.43,0.8,0.31, size=5.74x14.45x7.49
# The rollers that touch POLLEN: rubber-band rollers 186 mm wide (7.3 in) at the front of it; place and size est.
shape.intake = roller, at=7.7,0.8,2.6, size=3.2x7.3x3.2, crservo=rollerI
# The hopper: a ramp from the intake to the launcher, 2.0 to 6.9 in up.
shape.hopper = box, at=2.15,0.52,2.0, size=5.67x9.03x4.94
# The electronics (battery, switch) at the back, and the Control Hub.
shape.electronics = box, at=-5.47,0,0.75, size=4.44x10.0x5.29
shape.hub = box, at=-2.17,0.5,2.5, size=4.06x5.63x1.16
# The launcher frame on the left side, with its catapult arm inside: 0.3 to 17.5 in up.
shape.launcher = box, at=-0.09,4.41,0.31, size=15.69x10.06x17.19
# The flower mechanism on the right side: its mount, and the 2 in compliant wheel at its outer end (est.).
shape.flower_mount = box, at=0,-5.4,0.55, size=2.5x3.7x3.15
shape.flower = roller, at=0,-7.75,2.1, size=2x1x2, crservo=rollerF

# ---- Game pieces ----
# [manual]: the intake takes POLLEN off the floor into a gravity-fed hopper ("multi game piece capacity", the
# number is not stated; 4 is the game's limit) that feeds the catapult.
collect.intake = shape=intake, crservo=rollerI, holds=4
# Not modelled: the shot. The simulator only shoots from a flywheel (motor kind "flywheel" with a feeder motor);
# a catapult wound by a motor and fired by rubber bands is not one of its parts. [manual]: shoot from against the
# field wall, launcher centred on the goal; the release angle is set by the hood and is not published.
