# The simulator's pretend robot: every device, with the SAME names as the robot configuration on the
# Driver Station. This one matches the starter kit and the examples. Copy it for your own robot and
# change the names and numbers. Lines starting with # are notes.
#
# Physics is simple on purpose: it is for testing code and buttons, not for exact speeds.

# Battery voltage (12.8 = full; try 12.0 to see a weaker robot).
battery = 12.8

# ---- Drivetrain ----
# type: mecanum, tank (4 motors) or none. motors: front-left, front-right, back-left, back-right
# (tank with 2 motors: left, right). The left wheels are mounted mirrored, like a real robot.
drive.type = mecanum
drive.motors = front_left, front_right, back_left, back_right
# The REAL wheel size and motor numbers. 3.90 differs a little from the starter code's 3.78 on
# purpose: the Drive Tuner should find 3.90.
drive.wheelDiameterIn = 3.90
drive.ticksPerRev = 537.7
drive.gearRatio = 1
# Top speed of a wheel motor in encoder counts per second (312 RPM x 537.7 / 60 = 2796).
drive.maxTicksPerSec = 2796
drive.trackWidthIn = 15
drive.wheelBaseIn = 13
# Mecanum wheels go less far sideways than forward (0.85 = 85%). The strafe correction undoes it.
drive.strafeEfficiency = 0.85

# The turn sensor (IMU) in the Control Hub.
imu = imu

# ---- Other motors ----
# motor.NAME = kind, settings
# kinds: free (spins), lift (hard stops at min/max counts, gravity pulls it down),
#        flywheel (coasts for a long time; a shot slows it down when its feeder runs)
motor.lift = lift, maxTicksPerSec=2796, min=0, max=2750, gravity=0.06
motor.arm = lift, maxTicksPerSec=1400, min=0, max=1200, gravity=0.1
motor.intake = free, maxTicksPerSec=2796
motor.flywheel = flywheel, maxTicksPerSec=2800, feeder=feeder, shotDrop=0.15
motor.feeder = free, maxTicksPerSec=2796

# ---- Servos ----
# servo.NAME = where it starts (raw 0 to 1). servo.speed = how fast all servos move (raw per second).
servo.speed = 1.2
servo.claw = 0.5
servo.wrist = 0.5
servo.hood = 0.1

# Continuous-rotation servos.
crservo.spinner =

# ---- Switches ----
# touch.NAME = motor, below=N: pressed when that motor is within N counts of its bottom.
# (You can also click a switch in the panel.)
touch.lift_bottom = lift, below=20
touch.arm_touch = arm, below=20
