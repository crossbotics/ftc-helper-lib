# The simulator's pretend robot: every device, with the SAME names as the robot configuration on the
# Driver Station. This one matches the starter kit and the examples. Copy it for your own robot and
# change the names and numbers. Lines starting with # are notes.
#
# Physics is simple on purpose: it is for testing code and buttons, not for exact speeds.

# Battery voltage (12.8 = full; try 12.0 to see a weaker robot).
battery = 12.8

# ---- Field and robot ----
# The season's field (sim/fields/<name>.json). BIOBUZZ: the RED drive team is at the bottom (y = -72).
field = biobuzz-2026
# Robot size in inches (it bumps into field elements with this footprint) and where it starts:
# inches from the field center (+y away from the bottom drivers), heading 0 = facing away from them.
robot.lengthIn = 18
robot.widthIn = 18
robot.heightIn = 18
# A legal BIOBUZZ start (G304): touching the red wall, outside the LOADING ZONE, not touching a FLOWER.
start.x = -56
start.y = -61.55
start.heading = 0

# ---- Drivetrain ----
# type: mecanum, tank (4 motors) or none. motors: front-left, front-right, back-left, back-right
# (tank with 2 motors: left, right). The left wheels are mounted mirrored, like a real robot.
drive.type = mecanum
drive.motors = front_left, front_right, back_left, back_right
# The REAL wheel size and motor numbers. 3.90 differs a little from the starter code's 3.78 on
# purpose: the Drive Tuner should find 3.90.
drive.wheelDiameterIn = 3.90
drive.gearRatio = 1
# The wheel motors, from the parts catalog (sim/parts/parts.json): its speed and encoder counts.
# (Or give drive.maxTicksPerSec and drive.ticksPerRev yourself.)
drive.part = gobilda-5203-312
drive.trackWidthIn = 15
drive.wheelBaseIn = 13
# Mecanum wheels go less far sideways than forward (0.85 = 85%). The strafe correction undoes it.
drive.strafeEfficiency = 0.85

# The turn sensor (IMU) in the Control Hub.
imu = imu

# ---- Camera ----
# A webcam: name = its name in the robot configuration. Where it sits: inches forward/left/up from the
# robot's center on the floor; yaw (degrees, + = turned left) and pitch (+ = tilted up). hfov = how wide
# it sees in degrees (a Logitech C920 at 640x480: about 70). It finds the field file's AprilTags the way
# the FTC SDK does (BIOBUZZ: one "cluster" per CELL group of 4 tags). Field parts do not block its view.
camera.front = name=Webcam 1, forward=7, left=0, up=12, yaw=0, pitch=20, hfov=70.4, width=640, height=480
# A Limelight 3A: the same settings (hfov default 54.5). It reports each tag on its own (tx, ty, ta and the
# tag's pose in camera space), the way a real one does; every pipeline finds AprilTags.
limelight.ll = name=limelight, forward=6, left=-3, up=14, yaw=0, pitch=25

# ---- Other motors ----
# motor.NAME = kind, part=..., settings
# kinds: free (spins), lift (hard stops at min/max counts, gravity pulls it down),
#        flywheel (coasts for a long time; while its feeder runs, a piece goes through every 0.3 s)
# part: a motor from the catalog (sim/parts/parts.json) gives top speed, encoder counts and current.
motor.lift = lift, part=gobilda-5203-312, min=0, max=2750, gravity=0.06
motor.arm = lift, part=gobilda-5203-117, min=0, max=1200, gravity=0.1
motor.intake = free, part=gobilda-5203-1150
motor.flywheel = flywheel, part=gobilda-5203-6000, feeder=feeder, shotDrop=0.15
motor.feeder = free, part=gobilda-5203-1150

# ---- Servos ----
# servo.NAME = where it starts (raw 0 to 1), part=... (the catalog gives its speed).
# servo.speed = how fast servos WITHOUT a part move (raw positions per second).
servo.speed = 1.2
servo.claw = 0.5, part=gobilda-2000-torque
servo.wrist = 0.5, part=gobilda-2000-speed
servo.hood = 0.1, part=gobilda-2000-torque

# Continuous-rotation servos.
crservo.spinner =

# ---- Switches ----
# touch.NAME = motor, below=N: pressed when that motor is within N counts of its bottom.
# (You can also click a switch in the panel.)
touch.lift_bottom = lift, below=20
touch.arm_touch = arm, below=20

# ---- Shapes: the robot drawn as simple parts (3D view and size rules) ----
# shape.NAME = TYPE, on=PARENT, at=forward,left,up, size=forward x left-right x up, then what moves it.
# TYPE: box (fixed), slide (straight line), arm (hinge), turret, claw, roller, flywheel.
# Inches from the parent's mounting point; the chassis is robot.lengthIn x widthIn x chassisHeightIn.
# See docs/guides/simulator.md, "Robot shapes". Change these as the real robot is built.
robot.chassisHeightIn = 4
# The lift: a slide at the back, 8 in tall, moved by motor "lift" (2750 counts = 8 in of travel).
shape.lift = slide, at=-7,0,4, size=2x8x8, axis=up, motor=lift, ticksPerIn=344
# The arm rides on the lift's top: hangs straight down at the bottom stop, 3.5:1 chain to motor "arm" (its 1200-count stop = 96 degrees: up to level).
shape.arm = arm, on=lift, at=0,0,8, size=9x1.5x1.5, axis=left, motor=arm, gear=3.5, start=-90
# The wrist at the end of the arm, on servo "wrist" (position 0 = -90 degrees, 1 = +90).
shape.wrist = arm, on=arm, at=9,0,0, size=2.5x1.5x1.5, axis=left, servo=wrist, pos0=-90, pos1=90
# The claw on the wrist, on servo "claw": fingers 0 in apart at position 0, 3 in at 1.
shape.claw = claw, on=wrist, at=2.5,0,-1.5, size=2x0.5x3, servo=claw, pos0=0, pos1=3
# The intake roller across the front, on motor "intake".
shape.intake = roller, at=8,0,1.5, size=2x14x2, motor=intake
# The launcher wheel, on motor "flywheel".
shape.flywheel = flywheel, at=-1,0,4, size=4x2x4, motor=flywheel
