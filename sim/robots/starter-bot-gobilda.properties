# goBILDA FTC StarterBot (for BIOBUZZ), 2026-27: a test robot for the simulator.
# Only our own numbers: no CAD from goBILDA is in this repository.
#
# Sources (read 2026-10-16):
#   [page]  https://www.gobilda.com/ftc-starter-bot-resource-guide-2026-2027-season/
#   [guide] Assembly Instructions for FTC StarterBot (for BIOBUZZ), 3200-2627-0003 (PDF, 37 pages), from [page]
#   [code]  3200-2627-0003_example-code.zip from [page]: BioBuzzStarterBotTeleop.java and StarterBotAuto.java
#   [cad]   3200-2627-0003.zip from [page] (STEP). Measured on a laptop with build123d (part bounding boxes);
#           only the resulting numbers are written here. In the CAD the robot points along -Y, the frame is
#           centred on 0, and the lowest wheel touches the tiles at z = -48 mm.
# See docs/guides/starter-bots.md.

battery = 12.8

# ---- Field and robot ----
field = biobuzz-2026
# [cad]: the two 15-hole U-channel side rails are 384 mm long (15.1 in); the drive wheels' outside faces are
# 426 mm apart (16.8 in). The whole robot: 452 mm (17.8 in) front to back with the intake wheels, 305 mm
# (12.0 in) tall (top of the hood gridplate).
robot.lengthIn = 15.1
robot.widthIn = 16.8
robot.heightIn = 12.0
# Back against the red wall (inside face at y = -70.585, field file): -70.5 + 15.1 / 2. x as in the library's starter robot.
start.x = -56
start.y = -62.95
start.heading = 0

# ---- Drivetrain ----
# [page]: "drop-center 6WD chassis". [guide]: one 19.2:1 Yellow Jacket per side (5203-2402-0019), a 30-tooth
# gear to a 30-tooth gear (1:1), the other wheels chained 10T to 10T. [cad]: 4 x 96 mm Hogback wheels
# (3626-0014-0096) and 2 x 96 mm omni wheels (3624-0014-0096) at the intake end; the middle wheels sit 2 mm
# lower (the "drop"). [code]: "left_drive" (FORWARD) and "right_drive" (REVERSE), arcade drive.
drive.type = tank
drive.motors = left_drive, right_drive
drive.part = gobilda-5203-312
drive.wheelDiameterIn = 3.78           # 96 mm
drive.gearRatio = 1
drive.trackWidthIn = 15.83             # [cad]: wheel centres 402 mm apart
drive.wheelBaseIn = 11.34              # [cad]: omni axle to back axle, 288 mm
imu = imu

# ---- Motors ----
# Intake: a 50.9:1 Yellow Jacket (5203-2402-0051) and a 100-tooth / 20-tooth gear pair to a shaft of seven 48 mm
# GripForce Gecko wheels ([guide] steps 23-35). [code]: "intake", power = right trigger - left trigger.
motor.intake = free, part=gobilda-5203-117
# Launcher: a 19.2:1 Yellow Jacket converted to 1:1 ([guide] step 44) driving one 96 mm Hogback wheel.
# [code]: "launcher", setVelocity(1250) counts/s while right bumper is held (about 2680 rpm at 28 counts per turn);
# the feeder runs once it is above 1200. feeder=intake: while launching, the code also runs the intake motor
# (+0.5), and the simulator can only use a MOTOR as the feeder (the real feeder, "windmill", is a CR servo).
motor.launcher = flywheel, part=gobilda-5203-6000, feeder=intake

# ---- Servos ----
# [guide]: two 2000 Series Dual Mode servos (Speed, 2000-0025-0003) turn the 72 mm Gecko wheels at the intake's
# front corners; one 2000 Series (Torque, 2000-0025-0002) turns the "windmill" feeder. [code]: all three are
# CRServos: "left_intake_servo", "right_intake_servo" (REVERSE), "windmill" (REVERSE).
crservo.left_intake_servo =
crservo.right_intake_servo =
crservo.windmill =

# ---- Shapes (3D view and the size rules); [cad] numbers, mm / 25.4 ----
# The chassis box: the side rails and wheels, up to the top of the 96 mm wheels.
robot.chassisHeightIn = 3.8
# Intake: seven 48 mm Gecko wheels on a 240 mm shaft, centred 187 mm ahead of the frame centre and 93 mm up.
shape.intake = roller, at=7.36,-0.24,3.66, size=1.89x7.24x1.89, motor=intake
# The two 72 mm Gecko wheels lie flat (they turn about "up") at the front corners, 224 mm ahead, 156 mm out, 35 mm up.
# Which side the code's "left" servo is on is not stated: here it is the robot's left.
shape.left_wheel = roller, at=8.82,6.14,1.38, size=2.83x2.83x0.94, axis=up, crservo=left_intake_servo
shape.right_wheel = roller, at=8.82,-6.14,1.38, size=2.83x2.83x0.94, axis=up, crservo=right_intake_servo
# The two upright 10-hole U-channels behind the launcher (264 mm tall, from 40 mm up).
shape.tower = box, at=-3.46,0,1.57, size=1.89x7.24x10.39
# The launcher wheel: 96 mm Hogback, centred 40 mm behind the frame centre and 168 mm up.
shape.launcher = flywheel, at=-1.57,-0.18,6.61, size=3.78x0.94x3.78, motor=launcher
# The hood: the large gridplate (1117-0216-0352) over the launcher, 171 to 303 mm up (a box here; the real one is tilted).
shape.hood = box, at=1.04,0,6.73, size=7.13x6.95x5.2

# ---- Game pieces ----
# [page]: it pulls POLLEN out of a FLOWER and off the floor, carries up to four, and launches them into the HIVE.
collect.intake = shape=intake, motor=intake, holds=4
# The shot: [cad]'s hood gridplate rises toward the back, from 184 mm up at its front edge to 302 mm at its back
# edge (33 degrees from flat), with the launcher wheel under its back end. So a shot leaves up and BACKWARD:
# angle = 180 - 33 = 147 degrees from the robot's forward. est.: the real exit angle and speed are not published;
# share=0.5 (half the wheel's rim speed) is the simulator's default.
shoot.launcher = shape=launcher, angle=147, share=0.5
