// The simulator: a pretend Control Hub and Driver Hub on a laptop. Only in the standalone build
// (like examples/): robot projects never include it. Start it with:  ./gradlew :sim:run
// then open http://localhost:8780 . Docs: docs/guides/simulator.md
//
// Why the code is in src/test: the FTC SDK only ships as Android libraries. The unit-test set-up of
// an Android module already runs them on a laptop's Java, so the simulator runs there too.
plugins {
    id 'com.android.library'
}

def ftcSdkVersion = '12.0.0'

// ---- The team's own code ----
// When this library sits inside a robot project (ftc-helper-lib/ next to TeamCode/), the simulator also
// builds that TeamCode and lists only its OpModes. -PteamCode=<folder> picks another TeamCode folder;
// -PteamCode=none turns it off. Libraries TeamCode needs (Road Runner, Pedro, FTC Dashboard...) go in
// <robot project>/simulator/sim-dependencies.gradle (see docs/guides/simulator.md).
def teamCodeProp = project.findProperty('teamCode')
// An explicit path is read from the library's folder (where you run ./gradlew), like -Probot and -Pfile.
def teamCodeDir = teamCodeProp == 'none' ? null
        : (teamCodeProp ? rootProject.file(teamCodeProp) : new File(rootProject.projectDir, '../TeamCode'))
def useTeamCode = teamCodeDir != null && new File(teamCodeDir, 'src/main/java').isDirectory()
if (teamCodeProp && teamCodeProp != 'none' && !useTeamCode) {
    throw new GradleException("-PteamCode=$teamCodeProp: no src/main/java in $teamCodeDir")
}
def robotProject = useTeamCode ? teamCodeDir.parentFile : null
def teamRobotFile = robotProject != null ? new File(robotProject, 'simulator/robot.properties') : null

android {
    namespace 'com.crossbotics.ftchelper.sim'
    compileSdk 30

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        // The parts catalog and the season fields are data files, read from the classpath.
        test.resources.srcDirs += ['parts', 'fields']
        if (useTeamCode) test.java.srcDirs += [new File(teamCodeDir, 'src/main/java')]
    }

    testOptions {
        // Android calls the SDK makes (logging) do nothing on a laptop instead of failing.
        unitTests.returnDefaultValues = true
        // The scenario test runs the team's scenarios (simulator/scenarios) only when TeamCode is built in.
        unitTests.all {
            systemProperty 'sim.teamDir', useTeamCode ? robotProject.path : ''
            systemProperty 'ftchelper.dataDir', new File(buildDir, 'sim-data-test').path
            // A failed test shows its whole message in the console (CI's log), not only "AssertionError at line N".
            testLogging {
                events 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    testImplementation project(':library')
    testImplementation project(':examples')
    // Team code that uses Pedro Pathing (the pedro module) runs in the simulator too.
    testImplementation project(':pedro')
    testImplementation "org.firstinspires.ftc:RobotCore:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Hardware:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:FtcCommon:$ftcSdkVersion"
    testImplementation "org.firstinspires.ftc:Vision:$ftcSdkVersion"
    testImplementation 'junit:junit:4.13.2'
    // The real org.json (Android's is only a stub off the robot): the SDK reads Limelight results with it.
    testImplementation 'org.json:json:20240303'
    // The physics engine (pure Java; BSD licence, chosen of its BSD/LGPL pair): bumping, sliding, game pieces.
    testImplementation 'org.ode4j:core:0.5.4'
    // the convex hull of a CAD mesh (for the size rules): QuickHull3D by John E. Lloyd, BSD licence
    testImplementation 'com.github.quickhull3d:quickhull3d:1.0.0'
}

if (useTeamCode && new File(robotProject, 'simulator/sim-dependencies.gradle').isFile()) {
    apply from: new File(robotProject, 'simulator/sim-dependencies.gradle')
}

// Pedro's tuning library (start lesson 8, "Tune Pedro on the robot"): when the robot project uses it, TeamCode's
// tuner files need it here too, so the simulator adds it by itself (same version, from the same place).
if (useTeamCode) {
    def pedroTuning = null
    [new File(robotProject, 'build.dependencies.gradle'), new File(teamCodeDir, 'build.gradle')].each { f ->
        if (pedroTuning == null && f.isFile()) {
            def m = (f.text =~ /['"]com\.pedropathing:tuning:([^'"\s]+)['"]/)
            if (m.find()) pedroTuning = m.group(1)
        }
    }
    if (pedroTuning != null) {
        repositories { maven { url = 'https://repo.dairy.foundation/releases/' } }
        dependencies { testImplementation "com.pedropathing:tuning:$pedroTuning" }
    }
}

// Finder results and Characterizer logs from simulator runs go here (on a robot: /sdcard/FIRST/ftc-helper).
def simDataDir = new File(buildDir, 'sim-data').path

// ./gradlew :sim:run  [-Probot=path/to/robot.properties] [-Plan] [-Pport=8781] [-ProbotClass=...]  (-Plan: phones on the same
// WiFi can join; -Pport: another port, e.g. to run two simulators at once; -ProbotClass: the Robot class for Edit robot)
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Starts the simulator (open http://localhost:8780).'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimMain'
    workingDir = rootProject.projectDir
    def robot = project.findProperty('robot') ?:
            (teamRobotFile != null && teamRobotFile.isFile() ? teamRobotFile.path : 'sim/robots/starter.properties')
    args = [robot] + (project.hasProperty('lan') ? ['--lan'] : []) +
            (project.findProperty('port') ? ['--port', project.findProperty('port')] : [])
    systemProperty 'sim.teamOnly', useTeamCode
    // the robot project: the page's test recorder saves tests in its simulator/scenarios folder
    systemProperty 'sim.teamDir', useTeamCode ? robotProject.path : ''
    systemProperty 'ftchelper.dataDir', simDataDir
    // Edit robot: the Robot class whose .looks(...) the page prints (default: the one the robot file was made from)
    systemProperty 'sim.robotClass', project.findProperty('robotClass') ?: ''
}

// ./gradlew :sim:scenario -Pfile=path/to/test.sim [-Probot=...]   (several: -Pfile=a.sim,b.sim; a folder: every .sim in it)
// Runs scenario files without a browser and prints a report; fails if any "expect" fails.
// In a robot project, with no -Pfile: every test in simulator/scenarios (start lesson 10).
tasks.register('scenario', JavaExec) {
    group = 'verification'
    description = 'Runs simulator scenario files (see docs/guides/simulator.md).'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimScenario'
    workingDir = rootProject.projectDir
    def robot = project.findProperty('robot') ?:
            (teamRobotFile != null && teamRobotFile.isFile() ? teamRobotFile.path : 'sim/robots/starter.properties')
    def files = (project.findProperty('file') ?: '').split(',').findAll { it }
    if (files.isEmpty() && robotProject != null && new File(robotProject, 'simulator/scenarios').isDirectory()) {
        files = [new File(robotProject, 'simulator/scenarios').path]
    }
    args = ['--robot', robot] + files
    systemProperty 'sim.teamOnly', useTeamCode
    systemProperty 'ftchelper.dataDir', simDataDir
}

// ./gradlew :sim:fromConfig -Pconfig=path/to/config.xml [-Pout=path/to/robot.properties] [-Pfield=biobuzz-2026]
// A first robot file from the robot configuration (the XML file the Driver Station keeps on the Control Hub).
tasks.register('fromConfig', JavaExec) {
    group = 'application'
    description = 'Makes a draft robot file from a robot configuration XML file.'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimConfigImport'
    workingDir = rootProject.projectDir
    args = ['--config', project.findProperty('config') ?: ''] +
            (project.findProperty('out') ? ['--out', project.findProperty('out')] : []) +
            (project.findProperty('field') ? ['--field', project.findProperty('field')] : [])
}

// ./gradlew :sim:fromRobot -PteamCode=../TeamCode [-ProbotClass=org.firstinspires.ftc.teamcode.Robot]
//                          [-Pout=simulator/robot.properties] [-Pfield=biobuzz-2026]
// The robot file from the team's Robot.java: every device name and the drive from the code. Lines it
// writes are marked "# from Robot.java"; the team's own lines are kept.
tasks.register('fromRobot', JavaExec) {
    group = 'application'
    description = 'Writes (or refreshes) the simulator robot file from Robot.java.'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimFromRobot'
    workingDir = rootProject.projectDir
    def out = project.findProperty('out') ?: (teamRobotFile != null ? teamRobotFile.path : '')
    args = ['--robot', project.findProperty('robotClass') ?: '', '--out', out,
            '--field', project.findProperty('field') ?: '']
}

// ./gradlew :sim:newRobot -Pconfig=path/to/config.xml -PteamCode=../TeamCode [-Ppackage=org.firstinspires.ftc.teamcode]
// The team's five starting files (Robot, Tunables, Controls, Actions, autos/LeaveStart) from the robot
// configuration. Never overwrites a file.
tasks.register('newRobot', JavaExec) {
    group = 'application'
    description = 'Writes Robot.java, Tunables.java, Controls.java, Actions.java and a first autonomous from a configuration XML.'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimNewRobot'
    workingDir = rootProject.projectDir
    args = ['--config', project.findProperty('config') ?: '',
            '--teamCode', teamCodeDir != null ? teamCodeDir.path : '',
            '--package', project.findProperty('package') ?: '']
}

// ./gradlew :sim:fit [-Plog=path/to/log.csv or a folder] [-Probot=...] [-Pwrite] [-Pforce]
// Fits the Characterizer's logs (default: the simulator's own, in sim/build/sim-data/characterizer) and
// prints the robot-file numbers; -Pwrite also puts them into the robot file.
tasks.register('fit', JavaExec) {
    group = 'application'
    description = 'Fits Characterizer logs and prints (or writes) the robot file numbers.'
    def unitTest = tasks.named('testDebugUnitTest')
    dependsOn 'compileDebugUnitTestJavaWithJavac', 'processDebugUnitTestJavaRes'
    classpath = files({ unitTest.get().classpath })
    mainClass = 'com.crossbotics.ftchelper.sim.SimFit'
    workingDir = rootProject.projectDir
    def robot = project.findProperty('robot') ?:
            (teamRobotFile != null && teamRobotFile.isFile() ? teamRobotFile.path : 'sim/robots/starter.properties')
    def sample = !project.hasProperty('robot') && !(teamRobotFile != null && teamRobotFile.isFile())
    args = ['--robot', robot, '--log', project.findProperty('log') ?: new File(simDataDir, 'characterizer').path] +
            (project.hasProperty('write') ? ['--write'] : []) + (project.hasProperty('force') ? ['--force'] : []) +
            (sample ? ['--sample'] : [])
}
