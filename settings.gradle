// Standalone build of ftc-helper-lib (used for tests, CI and the examples).
// Robot projects do NOT use this file. They include only the `library` folder.
// See docs/setup/04-add-the-library.md.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'ftc-helper-lib'

include ':library'
include ':examples'
include ':sim'
include ':pedro'
